<!doctype html>
<html lang="ko">
<head><meta charset="utf-8">
  <meta name="naver-site-verification" content="f0d8a36999fb828fa450253fabd13b9a46fb66a4" />
  <meta name="google-site-verification" content="gDtEYejHbF6qjSawFMhzVKlWjfb9Jpnam0xdz5c_uko" />

    <meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1">
  <title>띵베이프 관리자 - 메인배너</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #fff;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --blue: #2f7df6;
      --blue-soft: #eaf2ff;
      --purple: #8b5cf6;
      --pink: #e566ca;
      --green: #19a66a;
      --orange: #f59e0b;
      --danger: #ef4444;
      --sidebar: #172033;
      --sidebar-2: #222c43;
      --shadow: 0 10px 26px rgba(15, 23, 42, .08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    button { cursor: pointer; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 232px 1fr;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      background: linear-gradient(180deg, var(--sidebar), var(--sidebar-2));
      color: #dbe4ff;
      overflow-y: auto;
    }

    .brand {
      height: 72px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #4ade80, #2f7df6);
      color: #fff;
      font-weight: 900;
    }

    .brand-text strong {
      display: block;
      color: #fff;
      font-size: 17px;
      letter-spacing: 0;
    }

    .brand-text span {
      display: block;
      margin-top: 2px;
      color: #9fb1d7;
      font-size: 11px;
      font-weight: 800;
    }

    .nav-section {
      padding: 14px 12px 6px;
    }

    .nav-title {
      padding: 10px 10px;
      color: #8ea0c7;
      font-size: 11px;
      font-weight: 900;
    }

    .nav-link {
      width: 100%;
      min-height: 42px;
      margin: 2px 0;
      padding: 0 11px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #cbd6f4;
      font-size: 14px;
      font-weight: 800;
    }

    .nav-link:hover,
    .nav-link.active {
      background: rgba(255,255,255,.1);
      color: #fff;
    }

    .nav-ico {
      width: 22px;
      text-align: center;
      color: #93c5fd;
      font-size: 15px;
    }

    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 64px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 24px;
    }

    .menu-toggle {
      display: none;
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .search {
      width: min(480px, 100%);
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #f9fafb;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
    }

    .search input {
      width: 100%;
      height: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .util-btn {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: #374151;
      font-size: 13px;
      font-weight: 800;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 9px;
      padding-left: 8px;
      font-size: 13px;
      font-weight: 900;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--blue);
      color: #fff;
    }

    .content {
      width: 100%;
      max-width: none;
      margin: 0;
      padding: 24px;
    }

    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 25px;
      letter-spacing: 0;
    }

    .page-head p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .primary {
      min-height: 40px;
      border: 0;
      border-radius: 9px;
      background: var(--blue);
      color: #fff;
      padding: 0 16px;
      font-weight: 900;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 18px;
    }

    .stack {
      display: grid;
      gap: 18px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-head {
      min-height: 58px;
      padding: 17px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .card-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-weight: 900;
      font-size: 17px;
    }

    .card-title small {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .card-body {
      padding: 18px;
    }

    .banner-admin {
      display: grid;
      gap: 14px;
    }

    .banner-list {
      display: grid;
      gap: 12px;
    }

    .banner-empty {
      min-height: 120px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: #f9fafb;
      color: var(--muted);
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 900;
    }

    .banner-row {
      display: grid;
      grid-template-columns: minmax(220px, 360px) minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .banner-thumb {
      min-height: 122px;
      border-radius: 7px;
      background-position: center;
      background-size: cover;
      border: 1px solid var(--line);
    }

    .banner-link-field {
      display: grid;
      gap: 7px;
      min-width: 0;
    }

    .banner-link-field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .banner-link-field input {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      outline: none;
      font-weight: 800;
    }

    .banner-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    @media (max-width: 760px) {
      .banner-row { grid-template-columns: 1fr; }
    }

    .todo-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(92px, 1fr));
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .todo {
      min-height: 102px;
      padding: 15px 8px;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 8px;
    }

    .todo span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .todo strong {
      font-size: 28px;
      line-height: 1;
    }

    .todo.accent strong { color: var(--blue); }
    .todo.warn strong { color: var(--orange); }

    .tabs {
      display: flex;
      gap: 6px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
    }

    .tab {
      min-height: 48px;
      border: 0;
      border-bottom: 3px solid transparent;
      background: transparent;
      padding: 0 12px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
    }

    .tab.active {
      color: var(--blue);
      border-bottom-color: var(--blue);
    }

    .sales-layout {
      display: grid;
      grid-template-columns: minmax(520px, 1.35fr) minmax(460px, .9fr);
      gap: 20px;
      align-items: stretch;
    }

    .chart-box {
      min-height: 380px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chart-note {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .chart {
      width: 100%;
      min-height: 318px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(#fff, #fbfdff);
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 18px;
      color: #4b5563;
      font-size: 12px;
      font-weight: 800;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      vertical-align: -1px;
    }

    .sales-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .sales-table th,
    .sales-table td {
      padding: 13px 10px;
      border-bottom: 1px solid var(--line);
      text-align: right;
      white-space: nowrap;
    }

    .sales-table th:first-child,
    .sales-table td:first-child { text-align: left; }

    .sales-table th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      background: #fafafa;
    }

    .sales-table strong { font-size: 14px; }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: #eef2ff;
      color: #3b5ccc;
      font-size: 11px;
      font-weight: 900;
    }

    .service-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .service {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      background: #fff;
    }

    .service span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .service strong {
      display: block;
      margin-top: 10px;
      font-size: 22px;
    }

    .service button {
      margin-top: 14px;
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      padding: 0 12px;
      font-size: 12px;
      font-weight: 900;
    }

    .dashboard-panel {
      display: none;
    }

    .dashboard-panel.active {
      display: block;
    }

    .live-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .live-card {
      min-height: 108px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 15px;
      background: #fff;
    }

    .live-card span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .live-card strong {
      display: block;
      margin-top: 8px;
      font-size: 25px;
      line-height: 1.1;
    }

    .live-card em {
      display: block;
      margin-top: 8px;
      color: var(--green);
      font-size: 12px;
      font-style: normal;
      font-weight: 900;
    }

    .live-card.warn em { color: var(--orange); }
    .live-card.danger em { color: var(--danger); }

    .status-list {
      display: grid;
      gap: 10px;
    }

    .status-row {
      display: grid;
      grid-template-columns: 132px minmax(120px, 1fr) 72px;
      gap: 12px;
      align-items: center;
      min-height: 42px;
      color: #374151;
      font-size: 13px;
      font-weight: 900;
    }

    .bar-track {
      height: 10px;
      border-radius: 999px;
      background: #eef2f7;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: var(--value, 50%);
      border-radius: 999px;
      background: var(--blue);
      transition: width .25s ease;
    }

    .bar-fill.green { background: var(--green); }
    .bar-fill.orange { background: var(--orange); }
    .bar-fill.pink { background: var(--pink); }

    .live-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .live-table th,
    .live-table td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .live-table th {
      background: #fafafa;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .live-table td:last-child,
    .live-table th:last-child {
      text-align: right;
    }

    .live-feed {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .feed-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: #fff;
    }

    .feed-item strong {
      display: block;
      font-size: 14px;
      line-height: 1.4;
    }

    .feed-item span {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .ad {
      min-height: 160px;
      border-radius: 10px;
      padding: 22px;
      background:
        linear-gradient(135deg, rgba(47,125,246,.96), rgba(139,92,246,.88)),
        radial-gradient(circle at 84% 12%, rgba(255,255,255,.32), transparent 34%);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      box-shadow: var(--shadow);
    }

    .ad strong {
      font-size: 22px;
      line-height: 1.25;
    }

    .ad span {
      margin-top: 8px;
      color: rgba(255,255,255,.8);
      font-size: 13px;
      line-height: 1.5;
    }

    .notice-list {
      display: grid;
      gap: 12px;
    }

    .notice {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: start;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .notice:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .notice strong {
      display: block;
      font-size: 14px;
      line-height: 1.45;
    }

    .notice span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .alarm-list {
      display: grid;
      gap: 12px;
    }

    .alarm {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: #fff;
    }

    .alarm .label {
      display: inline-flex;
      margin-bottom: 9px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #fff7e4;
      color: #d97706;
      font-size: 11px;
      font-weight: 900;
    }

    .alarm strong {
      display: block;
      font-size: 14px;
      line-height: 1.45;
    }

    .alarm p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .quick-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .quick {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      font-size: 13px;
      font-weight: 900;
    }

    .mobile-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(15, 23, 42, .46);
    }

    @media (max-width: 1240px) {
      .grid,
      .sales-layout { grid-template-columns: 1fr; }
      .live-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .todo-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    @media (max-width: 840px) {
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed;
        z-index: 40;
        left: 0;
        top: 0;
        transform: translateX(-100%);
        transition: transform .18s ease;
        width: 232px;
      }
      body.nav-open .sidebar { transform: translateX(0); }
      body.nav-open .mobile-overlay { display: block; }
      .menu-toggle { display: inline-grid; place-items: center; }
      .topbar { padding: 0 14px; }
      .search { display: none; }
      .util-btn:nth-child(1),
      .util-btn:nth-child(2) { display: none; }
      .content { padding: 18px 14px; }
      .page-head { align-items: stretch; flex-direction: column; }
      .todo-grid,
      .live-grid,
      .live-feed { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .sales-table { font-size: 12px; }
      .sales-table th,
      .sales-table td { padding: 11px 6px; }
    }

    @media (max-width: 480px) {
      .todo-grid,
      .live-grid,
      .live-feed { grid-template-columns: 1fr; }
      .profile span { display: none; }
      h1 { font-size: 22px; }
    }
    @media (max-width: 840px) {
      html, body { overflow-x: hidden; }
      .topbar {
        height: auto;
        min-height: 58px;
        padding: 8px 12px;
        gap: 8px;
      }
      .menu-toggle { flex: 0 0 38px; }
      .top-actions {
        margin-left: auto;
        gap: 6px;
        min-width: 0;
      }
      .top-actions .util-btn {
        min-height: 34px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 10px;
        font-size: 12px;
      }
      .top-actions .util-btn:nth-child(2) { display: none; }
      .profile { padding-left: 0; }
      .avatar { width: 32px; height: 32px; }
      .content { padding: 14px 12px 22px; }
      .page-head { gap: 12px; margin-bottom: 14px; }
      .page-head p { font-size: 13px; line-height: 1.5; }
      .primary {
        width: 100%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .card { border-radius: 8px; box-shadow: 0 6px 18px rgba(15, 23, 42, .06); }
      .card-head { min-height: 50px; padding: 13px 14px; }
      .card-title { flex-wrap: wrap; gap: 4px 8px; font-size: 15px; }
      .card-body { padding: 14px; }
      .todo-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .todo { min-height: 78px; padding: 12px 6px; gap: 6px; }
      .todo span { font-size: 12px; }
      .todo strong { font-size: 24px; }
      .tabs {
        gap: 4px;
        padding: 0 10px;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: thin;
      }
      .tab { min-height: 44px; padding: 0 10px; font-size: 13px; }
      .dashboard-panel { min-width: 0; overflow: hidden; }
      .sales-layout { grid-template-columns: minmax(0, 1fr); gap: 14px; }
      .chart-box { min-height: 0; }
      .chart { min-height: 0; height: auto; aspect-ratio: 620 / 330; }
      .legend { flex-wrap: wrap; gap: 8px 14px; }
      .sales-layout > div:last-child { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .sales-table { min-width: 560px; font-size: 12px; }
      .sales-table th,
      .sales-table td { padding: 10px 8px; }
      .live-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .live-card { min-height: 92px; padding: 12px; }
      .live-card strong { font-size: 21px; }
      .status-row { grid-template-columns: 92px minmax(0, 1fr) 52px; gap: 8px; font-size: 12px; }
      .live-table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
        -webkit-overflow-scrolling: touch;
      }
      .live-feed { grid-template-columns: 1fr; }
    }

    @media (max-width: 520px) {
      .topbar { padding: 8px 10px; }
      .top-actions .util-btn:nth-child(1) { display: inline-flex; }
      .top-actions .util-btn:nth-child(3) { display: none; }
      .content { padding: 12px 10px 20px; }
      h1 { font-size: 21px; }
      .card-body { padding: 12px; }
      .todo-grid,
      .live-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .live-card strong { font-size: 19px; }
      .status-row { grid-template-columns: 1fr; gap: 6px; }
      .status-row strong { text-align: left; }
    }

    @media (max-width: 380px) {
      .todo-grid,
      .live-grid { grid-template-columns: 1fr; }

  <script>
    const menuToggle = document.getElementById('menuToggle');
    const overlay = document.getElementById('overlay');
    const ORDER_STORAGE_KEY = 'tthingAdminOrders';
    const ORDER_UPDATED_KEY = 'tthingAdminOrdersUpdatedAt';
    const MAIN_BANNER_KEY = 'tthingMainBanner';
    const mainBannerInput = document.getElementById('mainBannerInput');
    const mainBannerUpload = document.getElementById('mainBannerUpload');
    const mainBannerClear = document.getElementById('mainBannerClear');
    const mainBannerList = document.getElementById('mainBannerList');
    menuToggle.addEventListener('click', () => document.body.classList.toggle('nav-open'));
    overlay.addEventListener('click', () => document.body.classList.remove('nav-open'));

    function readOrders() {
      try { return JSON.parse(localStorage.getItem(ORDER_STORAGE_KEY) || '[]'); }
      catch (error) { return []; }
    }

    function makeBannerId() {
      return 'banner-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
    }

    function normalizeMainBanner(data) {
      if (!data) return { banners: [] };
      if (Array.isArray(data.banners)) {
        return { banners: data.banners.filter(item => item && item.image).map(item => ({ id: item.id || makeBannerId(), image: item.image, link: item.link || '', updatedAt: item.updatedAt || data.updatedAt || '' })) };
      }
      if (data.image) return { banners: [{ id: data.id || makeBannerId(), image: data.image, link: data.link || '', updatedAt: data.updatedAt || '' }] };
      return { banners: [] };
    }

    let mainBannerState = { banners: [] };

    function readMainBanner() {
      if (mainBannerState.banners.length) return mainBannerState;
      try { return normalizeMainBanner(JSON.parse(localStorage.getItem(MAIN_BANNER_KEY) || 'null')); }
      catch (error) { return { banners: [] }; }
    }

    function writeMainBanner(data) {
      const normalized = normalizeMainBanner(data);
      mainBannerState = normalized;
      try {
        if (normalized.banners.length) localStorage.setItem(MAIN_BANNER_KEY, JSON.stringify({ banners: normalized.banners, updatedAt: new Date().toISOString() }));
        else localStorage.removeItem(MAIN_BANNER_KEY);
      } catch (error) {
        localStorage.removeItem(MAIN_BANNER_KEY);
      }
      return normalized;
    }

    function renderMainBanner() {
      if (!mainBannerList) return;
      const banners = readMainBanner().banners;
      mainBannerList.innerHTML = '';
      if (!banners.length) {
        const empty = document.createElement('div');
        empty.className = 'banner-empty';
        empty.textContent = '등록된 이미지 없음';
        mainBannerList.appendChild(empty);
        return;
      }
      banners.forEach((banner, index) => {
        const row = document.createElement('div');
        row.className = 'banner-row';
        row.dataset.bannerId = banner.id;

        const thumb = document.createElement('div');
        thumb.className = 'banner-thumb';
        thumb.style.backgroundImage = 'url("' + String(banner.image).replace(/"/g, '\"') + '")';

        const field = document.createElement('div');
        field.className = 'banner-link-field';
        const label = document.createElement('label');
        label.textContent = '배너 ' + (index + 1) + ' 링크';
        const input = document.createElement('input');
        input.type = 'url';
        input.value = banner.link || '';
        input.placeholder = 'https:// 또는 /product-detail.html...';
        input.dataset.bannerLink = '';

        const newWindowBox = document.createElement('label');
        newWindowBox.className = 'banner-newwindow-label';
        newWindowBox.style.display = 'inline-flex';
        newWindowBox.style.alignItems = 'center';
        newWindowBox.style.gap = '6px';
        newWindowBox.style.fontSize = '12px';
        newWindowBox.style.marginTop = '6px';
        newWindowBox.style.fontWeight = '900';
        newWindowBox.style.cursor = 'pointer';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = !!banner.newWindow;
        checkbox.dataset.bannerNewwindow = '';
        newWindowBox.append(checkbox, '새 창에서 열기');

        field.append(label, input, newWindowBox);

        const remove = document.createElement('button');
        remove.className = 'util-btn';
        remove.type = 'button';
        remove.dataset.bannerRemove = '';
        remove.textContent = '삭제';

        row.append(thumb, field, remove);
        mainBannerList.appendChild(row);
      });
    }

    async function persistMainBanner(data) {
      const normalized = normalizeMainBanner(data);
      mainBannerState = normalized;
      renderMainBanner();
      try {
        if (!normalized.banners.length) {
          localStorage.removeItem(MAIN_BANNER_KEY);
          await fetch('/api/main-banner', { method: 'DELETE' });
          return;
        }
        const response = await fetch('/api/main-banner', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ banners: normalized.banners })
        });
        if (response.ok) {
          writeMainBanner(await response.json());
          renderMainBanner();
          return;
        }
      } catch (error) {}
      writeMainBanner(normalized);
      renderMainBanner();
    }

    async function loadMainBanner() {
      try {
        let response = await fetch('/api/main-banner', { cache: 'no-store' });
        if (!response.ok) response = await fetch('../data/main-banner.json', { cache: 'no-store' });
        if (!response.ok) return;
        writeMainBanner(await response.json());
        renderMainBanner();
      } catch (error) {
        try {
          const response = await fetch('../data/main-banner.json', { cache: 'no-store' });
          if (!response.ok) return;
          writeMainBanner(await response.json());
          renderMainBanner();
        } catch (fallbackError) {}
      }
    }

    async function clearMainBanner() {
      mainBannerState = { banners: [] };
      localStorage.removeItem(MAIN_BANNER_KEY);
      renderMainBanner();
      try { await fetch('/api/main-banner', { method: 'DELETE' }); }
      catch (error) {}
    }

    function readImageFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    mainBannerUpload?.addEventListener('click', () => mainBannerInput?.click());
    mainBannerInput?.addEventListener('change', async (event) => {
      const files = Array.from(event.target.files || []).filter(file => file.type.startsWith('image/'));
      if (!files.length) {
        alert('이미지 파일만 등록할 수 있습니다.');
        event.target.value = '';
        return;
      }
      const current = readMainBanner().banners;
      const added = await Promise.all(files.map(async file => ({ id: makeBannerId(), image: await readImageFile(file), link: '', updatedAt: new Date().toISOString() })));
      await persistMainBanner({ banners: current.concat(added) });
      event.target.value = '';
    });
    mainBannerList?.addEventListener('input', (event) => {
      if (!event.target.matches('[data-banner-link]')) return;
      const row = event.target.closest('[data-banner-id]');
      const banners = readMainBanner().banners.map(banner => banner.id === row.dataset.bannerId ? { ...banner, link: event.target.value.trim() } : banner);
      writeMainBanner({ banners });
    });
    mainBannerList?.addEventListener('change', (event) => {
      if (!event.target.matches('[data-banner-link]')) return;
      persistMainBanner(readMainBanner());
    });
    mainBannerList?.addEventListener('click', (event) => {
      if (!event.target.matches('[data-banner-remove]')) return;
      const row = event.target.closest('[data-banner-id]');
      const banners = readMainBanner().banners.filter(banner => banner.id !== row.dataset.bannerId);
      persistMainBanner({ banners });
    });
    mainBannerClear?.addEventListener('click', clearMainBanner);
    renderMainBanner();
    loadMainBanner();

    function formatOrderCount(value) {
      return value + '건';
    }

    function applyOrderStats() {
      const orders = readOrders();
      const stats = { unpaidOrders: 0, readyOrders: 0, shippingOrders: 0, doneOrders: 0, cancelOrders: 0, exchangeOrders: 0, returnOrders: 0, depositCancelOrders: 0, claimOrders: 0 };
      orders.forEach((order) => {
        if (order.status === 'unpaid') stats.unpaidOrders += 1;
        else if (order.status === 'ready') stats.readyOrders += 1;
        else if (order.status === 'ship') stats.shippingOrders += 1;
        else if (order.status === 'done') stats.doneOrders += 1;
        else if (order.status === 'cancel') {
          stats.claimOrders += 1;
          if (order.cancelReasonType === 'exchange') stats.exchangeOrders += 1;
          else if (order.cancelReasonType === 'return') stats.returnOrders += 1;
          else if (order.cancelReasonType === 'deposit') stats.depositCancelOrders += 1;
          else stats.cancelOrders += 1;
        }
      });
      if (typeof liveState !== 'undefined') {
        liveState.unpaidOrders = stats.unpaidOrders;
        liveState.readyOrders = stats.readyOrders;
        liveState.shippingOrders = stats.shippingOrders;
        liveState.doneOrders = stats.doneOrders;
        liveState.claimOrders = stats.claimOrders;
      }
      document.querySelectorAll('[data-live]').forEach((node) => {
        if (node.dataset.live === 'unpaidOrders') node.textContent = formatOrderCount(stats.unpaidOrders);
        if (node.dataset.live === 'readyOrders') node.textContent = formatOrderCount(stats.readyOrders);
        if (node.dataset.live === 'shippingOrders') node.textContent = formatOrderCount(stats.shippingOrders);
        if (node.dataset.live === 'doneOrders') node.textContent = formatOrderCount(stats.doneOrders);
        if (node.dataset.live === 'cancelOrders') node.textContent = formatOrderCount(stats.cancelOrders);
        if (node.dataset.live === 'exchangeOrders') node.textContent = formatOrderCount(stats.exchangeOrders);
        if (node.dataset.live === 'returnOrders') node.textContent = formatOrderCount(stats.returnOrders);
        if (node.dataset.live === 'depositCancelOrders') node.textContent = formatOrderCount(stats.depositCancelOrders);
        if (node.dataset.live === 'claimOrders') node.textContent = formatOrderCount(stats.claimOrders);
      });
      document.querySelectorAll('.todo-grid .todo').forEach((card) => {
        const label = card.querySelector('span')?.textContent.trim() || '';
        const strong = card.querySelector('strong');
        if (!strong) return;
        if (label === '입금전') strong.textContent = formatOrderCount(stats.unpaidOrders);
        else if (label === '배송준비중') strong.textContent = formatOrderCount(stats.readyOrders);
        else if (label === '배송중') strong.textContent = formatOrderCount(stats.shippingOrders);
        else if (label === '배송완료') strong.textContent = formatOrderCount(stats.doneOrders);
        else if (label === '취소신청') strong.textContent = formatOrderCount(stats.cancelOrders);
        else if (label === '교환신청') strong.textContent = formatOrderCount(stats.exchangeOrders);
        else if (label === '반품신청') strong.textContent = formatOrderCount(stats.returnOrders);
        else if (label === '배송보류중' || label === '배송대기') strong.textContent = '0건';
      });
      const orderPanel = document.querySelector('[data-panel-content="orders"]');
      if (orderPanel) {
        orderPanel.querySelectorAll('.status-row').forEach((row) => {
          const label = row.querySelector('span')?.textContent.trim() || '';
          const strong = row.querySelector('strong[data-live]');
          const bar = row.querySelector('[data-bar]');
          if (label === '입금전') {
            if (strong) strong.textContent = formatOrderCount(stats.unpaidOrders);
            if (bar) bar.style.setProperty('--value', Math.max(4, stats.unpaidOrders * 4) + '%');
          } else if (label === '배송준비중') {
            if (strong) strong.textContent = formatOrderCount(stats.readyOrders);
            if (bar) bar.style.setProperty('--value', Math.max(4, stats.readyOrders * 4) + '%');
          } else if (label === '배송중') {
            if (strong) strong.textContent = formatOrderCount(stats.shippingOrders);
            if (bar) bar.style.setProperty('--value', Math.max(4, stats.shippingOrders * 4) + '%');
          } else if (label === '취소') {
            if (strong) strong.textContent = formatOrderCount(stats.cancelOrders);
            if (bar) bar.style.setProperty('--value', Math.max(4, stats.cancelOrders * 4) + '%');
          } else if (label === '교환') {
            if (strong) strong.textContent = formatOrderCount(stats.exchangeOrders);
            if (bar) bar.style.setProperty('--value', Math.max(4, stats.exchangeOrders * 4) + '%');
          } else if (label === '반품') {
            if (strong) strong.textContent = formatOrderCount(stats.returnOrders);
            if (bar) bar.style.setProperty('--value', Math.max(4, stats.returnOrders * 4) + '%');
          } else if (label === '입금취소') {
            if (strong) strong.textContent = formatOrderCount(stats.depositCancelOrders);
            if (bar) bar.style.setProperty('--value', Math.max(4, stats.depositCancelOrders * 4) + '%');
          }
        });
      }
      return stats;
    }

    const liveState = {
      activeUsers: 18,
      todayVisitors: 1284,
      cartUsers: 42,
      checkoutUsers: 7,
      pathNaver: 43,
      pathDirect: 31,
      pathKakao: 16,
      pathInsta: 12,
      unpaidOrders: 0,
      readyOrders: 0,
      shippingOrders: 0,
      doneOrders: 0,
      claimOrders: 0,
      cancelOrders: 0,
      exchangeOrders: 0,
      returnOrders: 0,
      depositCancelOrders: 0,
      newMembers: 5,
      totalMembers: 2418,
      pointIssued: 86000,
      pointUsed: 24500,
      normalMembers: 1942,
      vipMembers: 318,
      sleepMembers: 22,
      productQna: 9,
      reviews: 23,
      notices: 3,
      unansweredBoards: 4
    };

    const liveFormat = {
      activeUsers: '명',
      todayVisitors: '명',
      cartUsers: '명',
      checkoutUsers: '명',
      unpaidOrders: '건',
      readyOrders: '건',
      shippingOrders: '건',
      doneOrders: '건',
      claimOrders: '건',
      cancelOrders: '건',
      exchangeOrders: '건',
      returnOrders: '건',
      depositCancelOrders: '건',
      newMembers: '명',
      totalMembers: '명',
      pointIssued: '원',
      pointUsed: '원',
      normalMembers: '명',
      vipMembers: '명',
      sleepMembers: '명',
      productQna: '건',
      reviews: '건',
      notices: '건',
      unansweredBoards: '건'
    };

    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
    const comma = (value) => Number(value).toLocaleString('ko-KR');
    const randomStep = (range) => Math.floor(Math.random() * (range * 2 + 1)) - range;

    function formatLiveValue(key, value) {
      const suffix = liveFormat[key] || '';
      return suffix ? comma(value) + suffix : comma(value);
    }

    function setLiveText(key) {
      document.querySelectorAll('[data-live="' + key + '"]').forEach((node) => {
        node.textContent = formatLiveValue(key, liveState[key]);
      });
    }

    function updateBars() {
      const maxOrder = Math.max(1, liveState.readyOrders, liveState.shippingOrders, liveState.doneOrders / 12, liveState.claimOrders);
      document.querySelectorAll('[data-bar]').forEach((bar) => {
        const key = bar.dataset.bar;
        const value = key === 'doneOrders' ? liveState[key] / 12 : liveState[key];
        bar.style.setProperty('--value', clamp(Math.round((value / maxOrder) * 100), 4, 100) + '%');
      });
    }

    function updateLiveDashboard() {
      liveState.activeUsers = clamp(liveState.activeUsers + randomStep(3), 8, 44);
      liveState.todayVisitors += Math.max(0, randomStep(2));
      liveState.cartUsers = clamp(liveState.cartUsers + randomStep(2), 18, 64);
      liveState.checkoutUsers = clamp(liveState.checkoutUsers + randomStep(1), 2, 16);
      liveState.pathNaver = clamp(liveState.pathNaver + randomStep(2), 24, 68);
      liveState.pathDirect = clamp(liveState.pathDirect + randomStep(2), 18, 55);
      liveState.pathKakao = clamp(liveState.pathKakao + randomStep(1), 7, 30);
      liveState.pathInsta = clamp(liveState.pathInsta + randomStep(1), 4, 26);
      applyOrderStats();
      liveState.readyOrders = clamp(liveState.readyOrders, 0, 999);
      liveState.shippingOrders = clamp(liveState.shippingOrders, 0, 999);
      liveState.doneOrders = clamp(liveState.doneOrders, 0, 9999);
      liveState.newMembers += Math.random() > 0.84 ? 1 : 0;
      liveState.totalMembers += Math.random() > 0.9 ? 1 : 0;
      liveState.pointIssued += Math.random() > 0.76 ? 1000 : 0;
      liveState.pointUsed += Math.random() > 0.82 ? 500 : 0;
      liveState.productQna = clamp(liveState.productQna + randomStep(1), 0, 18);
      liveState.reviews += Math.random() > 0.88 ? 1 : 0;
      liveState.unansweredBoards = clamp(liveState.unansweredBoards + randomStep(1), 0, 12);

      Object.keys(liveState).forEach(setLiveText);
      updateBars();

      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      const salesUpdatedAt = document.getElementById('salesUpdatedAt');
      if (salesUpdatedAt) salesUpdatedAt.textContent = '2026-05-27 ' + hh + ':' + mm + ':' + ss + ' 실시간 갱신 · 단위/만원';
    }

    document.querySelectorAll('.tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        const panel = tab.dataset.panel;
        document.querySelectorAll('.tab').forEach((item) => item.classList.remove('active'));
        document.querySelectorAll('.dashboard-panel').forEach((item) => {
          item.classList.toggle('active', item.dataset.panelContent === panel);
        });
        tab.classList.add('active');
      });
    });

    applyOrderStats();
    updateLiveDashboard();
    window.addEventListener('storage', (event) => {
      if (event.key === ORDER_STORAGE_KEY || event.key === ORDER_UPDATED_KEY) applyOrderStats();
    });
    window.addEventListener('focus', applyOrderStats);
    window.addEventListener('pageshow', applyOrderStats);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) applyOrderStats();
    });
    setInterval(() => {
      if (!document.hidden) updateLiveDashboard();
    }, 3000);
  </script>
</body>
</html>
