  <title>주문 관리 - 띵베이프 관리자</title>
  <style>
    :root {
      --bg:#f4f6f8;
      --panel:#fff;
      --ink:#1f2937;
      --muted:#6b7280;
      --line:#e5e7eb;
      --blue:#2f7df6;
      --blue-soft:#eaf2ff;
      --green:#19a66a;
      --orange:#f59e0b;
      --danger:#ef4444;
      --sidebar:#172033;
      --sidebar-2:#222c43;
      --shadow:0 10px 26px rgba(15,23,42,.08);
    }

    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); }
    a { color:inherit; text-decoration:none; }
    button, input, select { font:inherit; }
    button { cursor:pointer; }
    .app { min-height:100vh; display:grid; grid-template-columns:232px 1fr; }
    .sidebar { position:sticky; top:0; height:100vh; background:linear-gradient(180deg,var(--sidebar),var(--sidebar-2)); color:#dbe4ff; overflow-y:auto; }
    .brand { height:72px; display:flex; align-items:center; gap:10px; padding:0 20px; border-bottom:1px solid rgba(255,255,255,.08); }
    .brand-mark { width:34px; height:34px; border-radius:9px; display:grid; place-items:center; background:linear-gradient(135deg,#4ade80,#2f7df6); color:#fff; font-weight:900; }
    .brand-text strong { display:block; color:#fff; font-size:17px; letter-spacing:0; }
    .brand-text span { display:block; margin-top:2px; color:#9fb1d7; font-size:11px; font-weight:800; }
    .nav-section { padding:14px 12px 6px; }
    .nav-title { padding:10px; color:#8ea0c7; font-size:11px; font-weight:900; }
    .nav-link { width:100%; min-height:42px; margin:2px 0; padding:0 11px; border-radius:8px; display:flex; align-items:center; gap:10px; color:#cbd6f4; font-size:14px; font-weight:800; }
    .nav-link:hover, .nav-link.active { background:rgba(255,255,255,.1); color:#fff; }
    .nav-ico { width:22px; text-align:center; color:#93c5fd; font-size:15px; }
    .main { min-width:0; display:flex; flex-direction:column; }
    .topbar { position:sticky; top:0; z-index:20; height:64px; border-bottom:1px solid var(--line); background:rgba(255,255,255,.92); backdrop-filter:blur(12px); display:flex; align-items:center; justify-content:space-between; gap:18px; padding:0 24px; }
    .menu-toggle { display:none; width:38px; height:38px; border:1px solid var(--line); border-radius:8px; background:#fff; }
    .search { width:min(480px,100%); height:40px; border:1px solid var(--line); border-radius:9px; background:#f9fafb; display:flex; align-items:center; gap:8px; padding:0 12px; }
    .search input { width:100%; height:100%; border:0; outline:0; background:transparent; color:var(--ink); }
    .top-actions { display:flex; align-items:center; gap:10px; white-space:nowrap; }
    .util-btn { min-height:36px; padding:0 12px; border:1px solid var(--line); border-radius:8px; background:#fff; color:#374151; font-size:13px; font-weight:800; }
    .profile { display:flex; align-items:center; gap:9px; padding-left:8px; font-size:13px; font-weight:900; }
    .avatar { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--blue); color:#fff; }
    .content { width:100%; max-width:none; margin:0; padding:24px; }
    .page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:18px; margin-bottom:18px; }
    h1 { margin:0; font-size:25px; letter-spacing:0; }
    .page-head p { margin:7px 0 0; color:var(--muted); font-size:14px; }
    .primary { min-height:40px; border:0; border-radius:9px; background:var(--blue); color:#fff; padding:0 16px; font-weight:900; }
    .metric-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; margin-bottom:18px; }
    .metric { min-height:92px; border:1px solid var(--line); border-radius:10px; background:#fff; box-shadow:var(--shadow); padding:16px; }
    .metric.active { border-color:var(--blue); box-shadow:0 0 0 3px rgba(47,125,246,.12), var(--shadow); }
    .metric span { color:var(--muted); font-size:12px; font-weight:900; }
    .metric strong { display:block; margin-top:10px; font-size:27px; line-height:1; }
    .metric.accent strong { color:var(--blue); }
    .metric.warn strong { color:var(--orange); }
    .metric.done strong { color:var(--green); }
    .card { border:1px solid var(--line); border-radius:10px; background:var(--panel); box-shadow:var(--shadow); overflow:hidden; }
    .card-head { min-height:58px; padding:17px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .card-title { display:flex; align-items:baseline; gap:10px; font-weight:900; font-size:17px; }
    .card-title small { color:var(--muted); font-size:12px; font-weight:800; }
    .card-body { padding:18px; }
    .tabs { display:flex; gap:6px; padding:0 18px; border-bottom:1px solid var(--line); overflow-x:auto; }
    .tab { min-height:48px; border:0; border-bottom:3px solid transparent; background:transparent; padding:0 12px; color:var(--muted); font-size:14px; font-weight:900; white-space:nowrap; }
    .tab.active { color:var(--blue); border-bottom-color:var(--blue); }
    .filter-grid { display:grid; grid-template-columns:1.1fr .8fr .8fr .8fr auto; gap:10px; align-items:end; }
    .field { display:grid; gap:7px; }
    .field label { color:#4b5563; font-size:12px; font-weight:900; }
    .field input, .field select { width:100%; height:40px; border:1px solid var(--line); border-radius:8px; background:#fff; padding:0 11px; outline:0; }
    .field input:focus, .field select:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(47,125,246,.12); }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:18px 0 12px; }
    .bulk { display:flex; gap:8px; flex-wrap:wrap; }
    .bulk button, .ghost { min-height:34px; border:1px solid var(--line); border-radius:8px; background:#fff; padding:0 11px; color:#374151; font-size:12px; font-weight:900; }
    .count-text { color:var(--muted); font-size:12px; font-weight:800; }
    .table-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:8px; }
    table { width:100%; min-width:1080px; border-collapse:collapse; font-size:13px; background:#fff; }
    table.ready-table { min-width:1320px; }
    th, td { padding:13px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; white-space:nowrap; }
    th { color:var(--muted); font-size:12px; font-weight:900; background:#fafafa; }
    tbody tr { cursor:pointer; }
    tbody tr:hover { background:#f8fbff; }
    tbody tr:last-child td { border-bottom:0; }
    .order-no { color:var(--blue); font-weight:900; }
    .order-no-btn { border:0; background:transparent; padding:0; color:var(--blue); font-weight:900; cursor:pointer; }
    .order-no-btn:hover { text-decoration:underline; }
    .product { white-space:normal; min-width:250px; }
    .product strong { display:block; line-height:1.45; }
    .product span { display:block; margin-top:4px; color:var(--muted); font-size:12px; }
    .badge { display:inline-flex; align-items:center; min-height:24px; padding:0 8px; border-radius:999px; background:#eef2ff; color:#3b5ccc; font-size:11px; font-weight:900; }
    .badge.unpaid { background:#fef2f2; color:#dc2626; }
    .badge.paid { background:#ecfdf3; color:#15803d; }
    .badge.ready { background:#eaf2ff; color:#1d4ed8; }
    .badge.ship { background:#fff7e4; color:#d97706; }
    .badge.cancel { background:#fef2f2; color:#dc2626; }
    .row-actions { display:flex; gap:6px; }
    .row-actions button { min-height:30px; border:1px solid var(--line); border-radius:7px; background:#fff; padding:0 9px; font-size:12px; font-weight:900; }
    .drawer { position:fixed; right:0; top:0; z-index:60; width:min(420px,100%); height:100vh; background:#fff; box-shadow:-16px 0 34px rgba(15,23,42,.16); transform:translateX(105%); transition:transform .2s ease; display:flex; flex-direction:column; }
    .drawer.open { transform:translateX(0); }
    .drawer-head { min-height:64px; padding:0 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .drawer-head strong { font-size:18px; }
    .close { width:36px; height:36px; border:1px solid var(--line); border-radius:8px; background:#fff; font-weight:900; }
    .drawer-body { padding:18px; overflow-y:auto; display:grid; gap:14px; }
    .detail-box { border:1px solid var(--line); border-radius:8px; padding:14px; }
    .detail-box h3 { margin:0 0 12px; font-size:15px; }
    .detail-row { display:flex; justify-content:space-between; gap:12px; color:#4b5563; font-size:13px; line-height:1.6; }
    .detail-row + .detail-row { margin-top:7px; }
    .detail-row strong { color:var(--ink); text-align:right; }
    .mobile-overlay { display:none; position:fixed; inset:0; z-index:30; background:rgba(15,23,42,.46); }
    .drawer-overlay { display:none; position:fixed; inset:0; z-index:55; background:rgba(15,23,42,.32); }
    .drawer-overlay.open { display:block; }

    @media (max-width:1240px) {
      .metric-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }

      { date:"2026-05-27 14:36", no:"20260527-000004", product:"깔끔 입호흡 시리즈 무니코틴", option:"3+1 / 수량 1개", buyer:"김민준", phone:"010-4921-1388", amount:43000, pay:"카드", status:"ready", invoice:"로젠택배 · 송장 입력대기", address:"서울특별시 양천구 화곡로8길 20-3" },
      { date:"2026-05-27 13:12", no:"20260527-000003", product:"더스페셜 입호흡 시리즈 무니코틴", option:"기본 / 수량 2개", buyer:"이서연", phone:"010-7741-5520", amount:25000, pay:"무통장", status:"ready", invoice:"로젠택배 · 송장 입력대기", address:"경기도 부천시 원미구 중동" },
      { date:"2026-05-27 11:48", no:"20260527-000002", product:"아보카도 베이비 킷", option:"기기 / 수량 1개", buyer:"박도윤", phone:"010-3982-0041", amount:50000, pay:"카드", status:"ship", shippedAt:"2026-05-27T11:48:00", invoice:"로젠택배 · 6884021512", address:"인천광역시 남동구 구월동" },

      { date:"2026-05-26 18:02", no:"20260526-000009", product:"테일러 마르키사 입호흡 시리즈 무니코틴", option:"기본 / 수량 1개", buyer:"정우진", phone:"010-6504-7721", amount:22000, pay:"카드", status:"done", invoice:"로젠택배 · 5832120901", address:"서울특별시 송파구 문정동" },

    ];

    function loadOrders() {
      try {
        const saved = JSON.parse(localStorage.getItem("tthingAdminOrders"));
        if (Array.isArray(saved) && saved.length) return saved;
      } catch (error) {}
      // 만약 저장된 데이터가 없으면 기본 샘플 데이터를 보여줍니다.
      return defaultOrders.map((order) => ({ ...order }));
    }

    function refreshOrders() {
      orders = loadOrders();
      renderRows();
    }

    window.addEventListener('storage', (event) => {
      if (event.key === 'tthingAdminOrders') {
        refreshOrders();
      }
    });

    let orders = loadOrders();

    function saveOrders() {
      localStorage.setItem("tthingAdminOrders", JSON.stringify(orders));
      localStorage.setItem("tthingAdminOrdersUpdatedAt", String(Date.now()));
    }

    function saveCurrentStatus() {
      localStorage.setItem("tthingAdminOrderStatus", currentStatus);
    }

    const statusText = {
      unpaid:"입금전",
      ready:"배송준비중",
      ship:"배송중",
      done:"배송완료",
      cancel:"취소완료"
    };

    const cancelTypeText = {
      cancel: "취소",
      exchange: "교환",
      return: "반품",
      deposit: "입금취소"
    };

    function getCancelLabel(order) {
      return cancelTypeText[order.cancelReasonType] || order.cancelType || "-";
    }

    function formatPrice(value) {
      return value.toLocaleString("ko-KR") + "원";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function autoCompleteDeliveredOrders() {
      const fiveDays = 5 * 24 * 60 * 60 * 1000;
      const now = Date.now();
      let changed = false;
      orders.forEach((order) => {
        if (order.status !== "ship" || !order.shippedAt) return;
        if (now - new Date(order.shippedAt).getTime() >= fiveDays) {
          order.status = "done";
          changed = true;
        }
      });
      if (changed) saveOrders();
    }

    function filteredOrders() {
      const text = keyword.value.trim().toLowerCase();
      const rows = orders.filter((order) => {
        const matchesStatus = currentStatus === "all" || order.status === currentStatus;
        const matchesPay = payFilter.value === "all" || order.pay === payFilter.value;
        const haystack = `${order.no} ${order.product} ${order.option || ""} ${order.buyer}`.toLowerCase();
        return matchesStatus && matchesPay && (!text || haystack.includes(text));
      });
      return rows.sort((a, b) => {
        const direction = currentStatus === "ready" ? 1 : -1;
        return direction * (new Date(a.date.replace(" ", "T")) - new Date(b.date.replace(" ", "T")));
      });
    }

    function updateMetrics() {
      document.querySelectorAll("[data-metric]").forEach((metric) => {
        const status = metric.dataset.metric;
        metric.querySelector("strong").textContent = orders.filter((order) => order.status === status).length;
      });
    }

    function confirmPayment(orderNos) {
      const targets = orders.filter((order) => orderNos.includes(order.no) && order.status === "unpaid");
      targets.forEach((order) => {
        order.status = "ready";
        order.invoice = "로젠택배 · 송장 입력대기";
      });
      if (targets.length) {
        saveOrders();
        currentStatus = "ready";
        saveCurrentStatus();
        targets.forEach((order) => {
          sendTelegramAlert([
            "[배송준비중 전환]",
            `주문번호: ${order.no}`,
            `주문자: ${order.buyer}`,
            `연락처: ${order.phone}`,
            `상품: ${order.product}`,
            `주소: ${order.address}`,
            `결제수단: ${order.pay}`
          ].join("\n"));
        });
      }
      document.querySelectorAll("[data-metric]").forEach((metric) => {
        metric.classList.toggle("active", metric.dataset.metric === currentStatus);
      });
      renderRows();
    }

    function renderRows() {
      keywordField.style.display = currentStatus === "ship" || currentStatus === "done" ? "grid" : "none";
      if (keywordField.style.display === "none") keyword.value = "";
      autoCompleteDeliveredOrders();
      const rows = filteredOrders();
      updateMetrics();
      resultCount.textContent = `총 ${rows.length}건`;
      checkAll.checked = false;
      orderTable.classList.toggle("ready-table", currentStatus === "ready");
      orderHead.innerHTML = currentStatus === "ready" ? readyHeadMarkup() : defaultHeadMarkup();
      orderRows.innerHTML = rows.map((order) => currentStatus === "ready" ? readyRowMarkup(order) : defaultRowMarkup(order)).join("");
      orderRows.querySelectorAll("button[data-payok]").forEach((button) => {
        button.addEventListener("click", () => confirmPayment([button.dataset.payok]));
      });
      orderRows.querySelectorAll("button[data-cancel-deposit]").forEach((button) => {
        button.addEventListener("click", () => cancelDeposit(button.dataset.cancelDeposit));
      });
      orderRows.querySelectorAll("button[data-save-invoice]").forEach((button) => {
        button.addEventListener("click", () => saveInvoice(button.dataset.saveInvoice));
      });
      orderRows.querySelectorAll("button[data-edit-address]").forEach((button) => {
        button.addEventListener("click", () => {
          const order = orders.find((item) => item.no === button.dataset.editAddress);
          if (order) openDrawer(order, true);
        });
      });
      orderRows.querySelectorAll("button[data-ship-start]").forEach((button) => {
        button.addEventListener("click", () => startShipping(button.dataset.shipStart));
      });
      orderRows.querySelectorAll("button[data-cancel-process]").forEach((button) => {
        button.addEventListener("click", () => processCancellation(button.dataset.cancelProcess, button.dataset.cancelType));
      });
      syncHeaderCheck();
      orderRows.querySelectorAll("tr").forEach((row) => {
        row.addEventListener("click", (event) => {
          if (event.target.closest("button") || event.target.closest("input")) return;
          openDrawer(orders.find((order) => order.no === row.dataset.no));
        });
      });
    }

    function defaultHeadMarkup() {
      return `
        <tr>
          <th><input id="checkAllHead" type="checkbox" aria-label="전체 선택"></th>
          <th>주문일시</th>
          <th>주문번호</th>
          <th>주문상품</th>
          <th>주문자</th>
          <th>결제금액</th>
          <th>결제</th>
          <th>주문상태</th>
          <th>배송정보</th>
          <th>처리</th>
        </tr>
      `;
    }

    function readyHeadMarkup() {
      return `
        <tr>
          <th>주문일<br>(결제일)</th>
          <th>주문번호</th>
          <th>주문자</th>
          <th>묶음선택</th>
          <th><input id="checkAllHead" type="checkbox" aria-label="전체 선택"></th>
          <th>운송장정보</th>
          <th>상품명/옵션</th>
          <th>수량</th>
          <th>판매가</th>
          <th>상품구매금액</th>
          <th>총 주문금액</th>
          <th>총 실결제금액</th>
          <th>결제수단</th>
          <th>메모</th>
        </tr>
      `;
    }

    function productMarkup(order) {
      const names = order.items && order.items.length
        ? order.items.map((item) => String(item.name || "").trim()).filter(Boolean)
        : String(order.product || "").split("\n").map((name) => name.trim()).filter(Boolean);
      return names.map(escapeHtml).join("<br>");
    }

    function optionMarkup(order) {
      const lines = order.items && order.items.length
        ? order.items.map((item) => {
            const rawOption = String(item.option || "").trim();
            const option = rawOption === "기본" || rawOption === "기본상품" ? "" : rawOption;
            return (option ? option + " / " : "") + "수량 " + Number(item.qty || 1) + "개";
          })
        : String(order.option || "수량 1개").split(/\n|<br\s*\/?\s*>/i).map((line) => line.replace(/^(기본|기본상품)\s*\/\s*/, "").trim()).filter(Boolean);
      return lines.map(escapeHtml).join("<br>");
    }

    function defaultRowMarkup(order) {
      return `
        <tr data-no="${order.no}">
          <td><input class="row-check" type="checkbox" aria-label="${order.no} 선택"></td>
          <td>${order.date}</td>
          <td>${currentStatus === "cancel" ? '<button type="button" class="order-no order-no-btn" data-cancel-process="' + order.no + '" data-cancel-type="' + (order.cancelReasonType || (order.cancelType === "교환" ? "exchange" : order.cancelType === "반품" ? "return" : order.cancelType === "입금취소" ? "deposit" : "cancel")) + '">' + order.no + '</button>' : '<span class="order-no">' + order.no + '</span>'}</td>
          <td class="product"><strong>${productMarkup(order)}</strong><span>${optionMarkup(order)}</span></td>
          <td>${order.buyer}<br><span class="count-text">${order.phone}</span><br><span class="count-text">${order.address}</span></td>
          <td><strong>${formatPrice(order.amount)}</strong></td>
          <td>${order.pay}</td>
          <td><span class="badge ${order.status}">${statusText[order.status]}</span></td>
          <td>${deliveryCell(order)}</td>
          <td><div class="row-actions">${actionCell(order)}<button type="button">메모</button></div></td>
        </tr>
      `;
    }

    function readyRowMarkup(order) {
      const unitPrice = Math.max(0, order.amount - 3000);
      return `
        <tr data-no="${order.no}">
          <td>${order.date}<br><span class="count-text">(${order.date})</span></td>
          <td><span class="order-no">${order.no}</span></td>
          <td>${order.buyer}<br><span class="count-text">${order.phone}</span><br><span class="count-text">[일반회원]</span></td>
          <td><span class="count-text">-</span></td>
          <td><input class="row-check" type="checkbox" aria-label="${order.no} 선택"></td>
          <td>${deliveryCell(order)}<br><button class="ghost" type="button" data-save-invoice="${order.no}">송장번호저장</button></td>
          <td class="product"><strong>${productMarkup(order)}</strong><span>${optionMarkup(order)}</span></td>
          <td>1</td>
          <td>${formatPrice(unitPrice)}</td>
          <td>${formatPrice(unitPrice)}</td>
          <td>${formatPrice(order.amount)}</td>
          <td>${formatPrice(Math.max(0, order.amount - 5900))}</td>
          <td>${order.pay}</td>
          <td>
            <div style="display:grid; gap:4px;">
              <button class="ghost" type="button" data-cancel-process="${order.no}" data-cancel-type="cancel">취소처리</button>
              <button class="ghost" type="button">USER</button>
              <button class="ghost" type="button">ADMIN</button>
            </div>
          </td>
        </tr>
        <tr data-no="${order.no}" class="response-row">
          <td colspan="14"><strong>수령자 : ${order.buyer}</strong> · 휴대전화 : ${order.phone} · 주소 : ${order.address}</td>
        </tr>
      `;
    }

    function deliveryCell(order) {
      if (order.status === "ready") {
        return '<select class="fSelect" aria-label="배송사 선택"><option selected>로젠택배</option></select><br><input class="invoice-input" data-invoice-no="' + order.no + '" type="text" placeholder="송장번호" style="width:100%;height:30px;margin-top:6px;border:1px solid var(--line);border-radius:7px;padding:0 8px;">';
      }
      return order.invoice;
    }

    function invoiceNumber(order) {
      const match = order.invoice.match(/·\s*(.+)$/);
      if (!match) return "";
      const value = match[1].trim();
      return value.includes("대기") || value.includes("준비") || value.includes("취소") ? "" : value;
    }

    function setInvoice(order, invoiceNo) {
      order.invoice = invoiceNo ? "로젠택배 · " + invoiceNo : "로젠택배 · 송장 입력대기";
    }

    function saveInvoice(orderNo) {
      const order = orders.find((item) => item.no === orderNo);
      const input = document.querySelector(`[data-invoice-no="${orderNo}"]`);
      if (!order || !input || !input.value.trim()) return;
      setInvoice(order, input.value.trim());
      saveOrders();
      renderRows();
    }

    function saveAddress(orderNo) {
      const order = orders.find((item) => item.no === orderNo);
      const input = document.querySelector(`[data-address-no="${orderNo}"]`);
      if (!order || !input) return;
      const value = input.value.trim();
      if (!value) return;
      order.address = value;
      saveOrders();
      renderRows();
      openDrawer(order, true);
    }

    function escapeCsv(value) {
      return '"' + String(value ?? '').replaceAll('"', '""') + '"';
    }

    function downloadExcel() {
      const rows = filteredOrders();
      const header = ["주문번호", "상품명", "옵션", "이름", "주소", "폰번호", "택배사", "송장번호"];
      const csv = [header, ...rows.map((order) => [order.no, order.product, String(order.option || "").replace(/\n/g, " / "), order.buyer, order.address, order.phone, "로젠택배", invoiceNumber(order)])]
        .map((row) => row.map(escapeCsv).join(","))
        .join("\n");
      const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `tthing-orders-${currentStatus}.csv`;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    function parseCsvLine(line) {
      const cells = [];
      let current = "";
      let quoted = false;
      for (let i = 0; i < line.length; i += 1) {
        const char = line[i];
        if (char === '"' && line[i + 1] === '"') { current += '"'; i += 1; }
        else if (char === '"') quoted = !quoted;
        else if (char === "," && !quoted) { cells.push(current); current = ""; }
        else current += char;
      }
      cells.push(current);
      return cells.map((cell) => cell.trim());
    }

    function uploadInvoiceExcel(file) {
      const reader = new FileReader();
      reader.onload = () => {
        const lines = String(reader.result).replace(/^\ufeff/, "").split(/\r?\n/).filter(Boolean);
        if (lines.length < 2) return;
        const header = parseCsvLine(lines[0]);
        const orderIndex = header.indexOf("주문번호");
        const invoiceIndex = header.indexOf("송장번호");
        if (orderIndex < 0 || invoiceIndex < 0) {
          alert("주문번호와 송장번호 열이 필요합니다.");
          return;
        }
        let updated = 0;
        lines.slice(1).forEach((line) => {
          const cells = parseCsvLine(line);
          const order = orders.find((item) => item.no === cells[orderIndex]);
          const invoiceNo = cells[invoiceIndex];
          if (order && invoiceNo) {
            setInvoice(order, invoiceNo);
            updated += 1;
          }
        });
        if (updated) saveOrders();
        renderRows();
        alert(`${updated}건의 송장번호를 등록했습니다.`);
      };
      reader.readAsText(file, "utf-8");
    }

    function startShipping(orderNo) {
      const order = orders.find((item) => item.no === orderNo);
      if (!order) return;
      const input = document.querySelector(`[data-invoice-no="${orderNo}"]`);
      if (input && input.value.trim()) setInvoice(order, input.value.trim());
      order.status = "ship";
      order.shippedAt = new Date().toISOString();
      currentStatus = "ship";
      saveCurrentStatus();
      saveOrders();
      document.querySelectorAll("[data-metric]").forEach((metric) => {
        metric.classList.toggle("active", metric.dataset.metric === currentStatus);
      });
      renderRows();
    }

    function cancelDeposit(orderNo) {
      const order = orders.find((item) => item.no === orderNo);
      if (!order || order.status !== "unpaid") return;
      if (!confirm("주문 " + orderNo + "의 입금을 취소하시겠습니까?")) return;
      order.status = "cancel";
      order.cancelReasonType = "deposit";
      order.cancelType = "입금취소";
      order.invoice = "입금 취소";
      saveOrders();
      sendTelegramAlert([
        "[입금취소]",
        `주문번호: ${order.no}`,
        `주문자: ${order.buyer}`,
        `연락처: ${order.phone}`,
        `상품: ${order.product}`
      ].join("\n"));
      renderRows();
      openDrawer(order);
    }

    function processCancellation(orderNo, type) {
      const order = orders.find((item) => item.no === orderNo);
      if (!order) return;
      const label = cancelTypeText[type] || "취소";
      if (!confirm("주문 " + orderNo + "을(를) " + label + " 처리하시겠습니까?")) return;
      order.status = "cancel";
      order.cancelReasonType = type || "cancel";
      order.cancelType = label;
      order.invoice = label + " 처리";
      saveOrders();
      sendTelegramAlert([
        `[${label}]`,
        `주문번호: ${order.no}`,
        `주문자: ${order.buyer}`,
        `연락처: ${order.phone}`,
        `상품: ${order.product}`,
        `사유: ${label}`
      ].join("\n"));
      renderRows();
      openDrawer(order);
    }

    function restoreToReady(orderNo) {
      const order = orders.find((item) => item.no === orderNo);
      if (!order) return;
      if (!confirm("주문 " + orderNo + "을(를) 배송준비중으로 복구하시겠습니까?")) return;
      order.status = "ready";
      order.cancelType = "";
      order.cancelReasonType = "";
      order.invoice = "로젠택배 · 송장 입력대기";
      saveOrders();
      currentStatus = "ready";
      saveCurrentStatus();
      renderRows();
      openDrawer(order);
    }

    function actionCell(order) {
      if (order.status === "unpaid") return '<button type="button" data-payok="' + order.no + '">입금확인</button><button type="button" data-cancel-deposit="' + order.no + '">입금취소</button>';
      if (order.status === "ready") return '<button type="button" data-edit-address="' + order.no + '">주소수정</button><button type="button" data-save-invoice="' + order.no + '">송장저장</button><button type="button" data-ship-start="' + order.no + '">배송중 처리</button><button type="button" data-cancel-process="' + order.no + '" data-cancel-type="cancel">취소처리</button>';
      if (order.status === "cancel") return '<button type="button" data-restore-ready="' + order.no + '">배송준비중 복구</button><button type="button" data-cancel-process="' + order.no + '" data-cancel-type="exchange">교환처리</button><button type="button" data-cancel-process="' + order.no + '" data-cancel-type="return">반품처리</button>';
      if (order.status === "ship") return '<button type="button">배송추적</button><button type="button">배송완료</button>';
      return '<button type="button">처리</button>';
    }

    function openDrawer(order, focusAddress = false) {
      drawerBody.innerHTML = `
        <div class="detail-box">
          <h3>주문 정보</h3>
          <div class="detail-row"><span>주문번호</span><strong>${order.no}</strong></div>
          <div class="detail-row"><span>주문일시</span><strong>${order.date}</strong></div>
          <div class="detail-row"><span>상태</span><strong>${statusText[order.status]}</strong></div>
          <div class="detail-row"><span>취소유형</span><strong>${getCancelLabel(order)}</strong></div>
          <div class="detail-row"><span>결제수단</span><strong>${order.pay}</strong></div>
          <div class="detail-row"><span>결제금액</span><strong>${formatPrice(order.amount)}</strong></div>
        </div>
        <div class="detail-box">
          <h3>상품 정보</h3>
          <div class="detail-row"><span>상품명</span><strong>${productMarkup(order)}</strong></div>
          <div class="detail-row"><span>옵션</span><strong>${optionMarkup(order)}</strong></div>
        </div>
        <div class="detail-box">
          <h3>배송 정보</h3>
          <div class="detail-row"><span>수령인</span><strong>${order.buyer}</strong></div>
          <div class="detail-row"><span>연락처</span><strong>${order.phone}</strong></div>
          ${order.status === "ready" ? `
          <div class="detail-row" style="align-items:flex-start;">
            <span>배송지</span>
            <div style="flex:1; display:grid; gap:8px;">
              <textarea data-address-no="${order.no}" rows="3" style="width:100%; min-height:86px; border:1px solid var(--line); border-radius:8px; padding:10px; resize:vertical; line-height:1.5;">${escapeHtml(order.address || "")}</textarea>
              <div style="display:flex; justify-content:flex-end; gap:8px;">
                <button type="button" class="ghost" data-save-address="${order.no}">주소저장</button>
              </div>
              <span class="count-text">송장 등록 전 배송지만 변경됩니다.</span>
            </div>
          </div>` : `<div class="detail-row"><span>주소</span><strong>${escapeHtml(order.address)}</strong></div>`}
          <div class="detail-row"><span>택배사</span><strong>로젠택배</strong></div>
          <div class="detail-row"><span>송장</span><strong>${escapeHtml(order.invoice)}</strong></div>
        </div>
        <div class="detail-box">
          <h3>처리</h3>
          <div class="row-actions">
            ${order.status === "ready" ? `<button type="button" data-cancel-process="${order.no}" data-cancel-type="cancel">취소처리</button>` : ""}
            ${order.status === "cancel" ? `<button type="button" data-restore-ready="${order.no}">배송준비중 복구</button><button type="button" data-cancel-process="${order.no}" data-cancel-type="exchange">교환처리</button><button type="button" data-cancel-process="${order.no}" data-cancel-type="return">반품처리</button>` : ""}
            ${order.status === "unpaid" ? `<button type="button" data-cancel-deposit="${order.no}">입금취소</button>` : ""}
          </div>
        </div>
      `;
      drawer.classList.add("open");
      drawerOverlay.classList.add("open");
      drawerBody.querySelectorAll("button[data-save-address]").forEach((button) => {
        button.addEventListener("click", () => saveAddress(button.dataset.saveAddress));
      });
      drawerBody.querySelectorAll("textarea[data-address-no]").forEach((input) => {
        input.addEventListener("input", () => {
          order.address = input.value;
          saveOrders();
        });
      });
      drawerBody.querySelectorAll("button[data-cancel-deposit]").forEach((button) => {
        button.addEventListener("click", () => cancelDeposit(button.dataset.cancelDeposit));
      });
      drawerBody.querySelectorAll("button[data-cancel-process]").forEach((button) => {
        button.addEventListener("click", () => processCancellation(button.dataset.cancelProcess, button.dataset.cancelType));
      });
      drawerBody.querySelectorAll("button[data-restore-ready]").forEach((button) => {
        button.addEventListener("click", () => restoreToReady(button.dataset.restoreReady));
      });
      if (focusAddress) {
        const addressField = drawerBody.querySelector(`[data-address-no="${order.no}"]`);
        if (addressField) {
          addressField.focus();
          addressField.setSelectionRange(addressField.value.length, addressField.value.length);
        }
      }
    }

    function closeDrawer() {
      drawer.classList.remove("open");
      drawerOverlay.classList.remove("open");
    }

    document.querySelectorAll("[data-metric]").forEach((metric) => {
      metric.addEventListener("click", (event) => {
        event.preventDefault();
        document.querySelectorAll("[data-metric]").forEach((item) => item.classList.remove("active"));
        metric.classList.add("active");
        currentStatus = metric.dataset.metric;
        saveCurrentStatus();
        renderRows();
      });
    });

    function syncHeaderCheck() {
      const dynamicCheck = document.getElementById("checkAllHead");
      if (!dynamicCheck) return;
      dynamicCheck.checked = checkAll.checked;
      dynamicCheck.addEventListener("change", () => {
        checkAll.checked = dynamicCheck.checked;
        document.querySelectorAll(".row-check").forEach((checkbox) => {
          checkbox.checked = dynamicCheck.checked;
        });
      });
    }

    checkAll.addEventListener("change", () => {
      document.querySelectorAll(".row-check").forEach((checkbox) => {
        checkbox.checked = checkAll.checked;
      });
      const dynamicCheck = document.getElementById("checkAllHead");
      if (dynamicCheck) dynamicCheck.checked = checkAll.checked;
    });

    document.getElementById("paymentOkButton").addEventListener("click", () => {
      const selected = [...document.querySelectorAll(".row-check:checked")].map((checkbox) => checkbox.closest("tr").dataset.no);
      confirmPayment(selected);
    });
    document.getElementById("excelDownloadButton").addEventListener("click", downloadExcel);
    document.getElementById("invoiceUploadButton").addEventListener("click", () => document.getElementById("invoiceExcelInput").click());
    document.getElementById("invoiceExcelInput").addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (file) uploadInvoiceExcel(file);
      event.target.value = "";
    });

    document.getElementById("filterButton").addEventListener("click", renderRows);
    keyword.addEventListener("input", renderRows);
    payFilter.addEventListener("change", renderRows);
    menuToggle.addEventListener("click", () => document.body.classList.toggle("nav-open"));
    overlay.addEventListener("click", () => document.body.classList.remove("nav-open"));
    document.getElementById("drawerClose").addEventListener("click", closeDrawer);
    drawerOverlay.addEventListener("click", closeDrawer);
    autoCompleteDeliveredOrders();
    document.querySelectorAll("[data-metric]").forEach((metric) => {
      metric.classList.toggle("active", metric.dataset.metric === currentStatus);
    });
    renderRows();
  </script>
</body>
</html>
