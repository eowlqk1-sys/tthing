:#fef2f2;color:#dc2626}.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumb{width:72px;height:72px;border:1px solid var(--line);border-radius:8px;background:#f8fafc;object-fit:cover}.preview{display:grid;gap:8px;max-height:260px;overflow:auto;border:1px dashed var(--line);border-radius:8px;padding:8px;background:#fafafa}.preview img{width:100%;border-radius:7px;border:1px solid var(--line);background:#fff}.row-actions{display:flex;gap:6px}.row-actions button{min-height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 9px;font-size:12px;font-weight:900}.hint{color:var(--muted);font-size:12px;line-height:1.55}.mobile-overlay{display:none;position:fixed;inset:0;z-index:30;background:rgba(15,23,42,.46)}@media(max-width:1100px){.grid{grid-template-columns:1fr}}@media(max-width:840px){html,body{overflow-x:hidden}.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:40;left:0;top:0;width:232px;transform:translateX(-100%);transition:transform .18s ease}body.nav-open .sidebar{transform:translateX(0)}body.nav-open .mobile-overlay{display:block}.menu-toggle{display:inline-grid;place-items:center}.topbar{height:auto;min-height:58px;padding:8px 12px}.profile span:not(.avatar){display:none}.content{padding:14px 12px 22px}.page-head{align-items:stretch;flex-direction:column}.form-row{grid-template-columns:1fr}.card-body{padding:14px}table{min-width:760px}}

        </div></nav></aside><main class="main"><header class="topbar"><button class="menu-toggle" id="menuToggle" type="button">☰</button><a class="util-btn" href="/tthing/index.html" target="_blank" rel="noopener">PC 쇼핑몰</a><div class="profile"><span class="avatar">E</span><span>eowlqk1 대표운영자</span></div></header><section class="content"><div class="page-head"><div><h1>팝업 관리</h1><p>이미지만 등록해도 고객 홈페이지 메인에 팝업창이 각각 따로 표시됩니다.</p></div><button class="primary" id="newPopup" type="button">새 팝업</button></div><div class="grid"><section class="card"><div class="card-head"><div class="card-title">팝업 목록</div><span class="hint" id="countText"></span></div><div class="card-body"><div class="table-wrap"><table><thead><tr><th>팝업명</th><th>상태</th><th>이미지</th><th>크기</th><th>위치</th><th>관리</th></tr></thead><tbody id="popupRows"></tbody></table></div></div></section><aside class="card"><div class="card-head"><div class="card-title" id="formTitle">새 팝업</div><button class="ghost" id="resetForm" type="button">초기화</button></div><div class="card-body"><input id="popupId" type="hidden"><div class="field"><label>팝업명</label><input id="popupTitle" placeholder="예: 주말 할인 팝업"></div><div class="form-row"><div class="field"><label>공개여부</label><select id="popupVisible"><option value="visible">공개</option><option value="hidden">비공개</option></select></div><div class="field"><label>링크 URL</label><input id="popupLink" placeholder="선택 입력"></div></div><div class="form-row"><div class="field"><label>너비(px)</label><input id="popupWidth" type="number" min="240" max="900" value="420"></div><div class="field"><label>위치</label><select id="popupPosition"><option value="center">가운데</option><option value="left">왼쪽</option><option value="right">오른쪽</option></select></div></div><div class="field"><label>이미지 등록</label><input id="popupImages" type="file" accept="image/*" multiple><p class="hint">한 팝업창에 여러 이미지를 등록할 수 있습니다. 새 이미지를 선택하면 기존 이미지에 추가됩니다.</p></div><div class="preview" id="imagePreview"></div><div class="form-row" style="margin-top:12px"><button class="primary" id="savePopup" type="button">저장</button><button class="danger" id="deletePopup" type="button">삭제</button></div></div></aside></div></section></main></div><script>
const STORAGE_KEY='tthingHomePopups';let popups=loadPopups(),editingImages=[];const els={menuToggle:document.getElementById('menuToggle'),overlay:document.getElementById('overlay'),newPopup:document.getElementById('newPopup'),resetForm:document.getElementById('resetForm'),saveBtn:document.getElementById('savePopup'),deleteBtn:document.getElementById('deletePopup'),popupImages:document.getElementById('popupImages'),imagePreview:document.getElementById('imagePreview'),popupRows:document.getElementById('popupRows')};function loadPopups(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch(e){return []}}function savePopups(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(popups));return true}catch(e){alert('이미지 용량이 너무 큽니다. 더 작은 이미지로 등록해주세요.');return false}}function esc(v){return String(v||'').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]))}function resetEditor(){popupId.value='';popupTitle.value='';popupVisible.value='visible';popupLink.value='';popupWidth.value=420;popupPosition.value='center';els.popupImages.value='';editingImages=[];formTitle.textContent='새 팝업';els.deleteBtn.disabled=true;renderPreview()}function renderRows(){countText.textContent='총 '+popups.length+'개';els.popupRows.innerHTML=popups.map(p=>'<tr><td><strong>'+esc(p.title||'이름 없는 팝업')+'</strong></td><td><span class="badge '+(p.visible?'good':'danger')+'">'+(p.visible?'공개':'비공개')+'</span></td><td><div class="thumbs">'+(p.images||[]).slice(0,4).map(img=>'<img class="thumb" src="'+img.src+'" alt="">').join('')+'</div></td><td>'+Number(p.width||420)+'px</td><td>'+({center:'가운데',left:'왼쪽',right:'오른쪽'}[p.position]||'가운데')+'</td><td><div class="row-actions"><button type="button" data-edit="'+p.id+'">수정</button><button type="button" data-toggle="'+p.id+'">'+(p.visible?'숨김':'공개')+'</button><button type="button" data-delete-row="'+p.id+'">삭제</button></div></td></tr>').join('')||'<tr><td colspan="6">등록된 팝업이 없습니다.</td></tr>'}function renderPreview(){els.imagePreview.innerHTML=editingImages.map((img,i)=>'<div><img src="'+img.src+'" alt=""><button class="ghost" type="button" data-remove-img="'+i+'" style="margin-top:6px;width:100%">이미지 삭제</button></div>').join('')||'<p class="hint">등록된 이미지가 없습니다.</p>'}function editPopup(id){const p=popups.find(x=>x.id===id);if(!p)return;popupId.value=p.id;popupTitle.value=p.title||'';popupVisible.value=p.visible?'visible':'hidden';popupLink.value=p.link||'';popupWidth.value=p.width||420;popupPosition.value=p.position||'center';editingImages=(p.images||[]).slice();formTitle.textContent='팝업 수정';els.deleteBtn.disabled=false;renderPreview();window.scrollTo({top:0,behavior:'smooth'})}function saveCurrentPopup(){if(!editingImages.length){alert('이미지를 1개 이상 등록해주세요.');return}const id=popupId.value||'popup-'+Date.now();const cur=popups.find(x=>x.id===id);const next={id,title:popupTitle.value.trim()||'팝업',visible:popupVisible.value==='visible',link:popupLink.value.trim(),width:Math.max(240,Math.min(900,Number(popupWidth.value)||420)),position:popupPosition.value,images:editingImages,createdAt:cur?cur.createdAt:new Date().toISOString()};popups=cur?popups.map(x=>x.id===id?next:x):popups.concat(next);if(!savePopups())return;resetEditor();renderRows();alert('저장되었습니다.')}function deleteCurrent(){if(!popupId.value)return;if(!confirm('팝업을 삭제할까요?'))return;popups=popups.filter(x=>x.id!==popupId.value);savePopups();resetEditor();renderRows()}function compactImage(file,done){
  const reader=new FileReader();
  reader.onload=function(){
    if(file.type==='image/gif'){done(reader.result);return}
    const img=new Image();
    img.onload=function(){
      const max=1200;
      const scale=Math.min(1,max/Math.max(img.width,img.height));
      const canvas=document.createElement('canvas');
      canvas.width=Math.max(1,Math.round(img.width*scale));
      canvas.height=Math.max(1,Math.round(img.height*scale));
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      try{done(canvas.toDataURL('image/webp',0.86))}catch(e){done(reader.result)}
    };
    img.onerror=function(){done(reader.result)};
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}
function readFiles(files){[...files].forEach(file=>{compactImage(file,src=>{editingImages.push({name:file.name,src:src});renderPreview()})})}els.menuToggle.addEventListener('click',()=>document.body.classList.toggle('nav-open'));els.overlay.addEventListener('click',()=>document.body.classList.remove('nav-open'));els.newPopup.addEventListener('click',resetEditor);els.resetForm.addEventListener('click',resetEditor);els.saveBtn.addEventListener('click',saveCurrentPopup);els.deleteBtn.addEventListener('click',deleteCurrent);els.popupImages.addEventListener('change',e=>readFiles(e.target.files));els.imagePreview.addEventListener('click',e=>{const btn=e.target.closest('[data-remove-img]');if(!btn)return;editingImages.splice(Number(btn.dataset.removeImg),1);renderPreview()});els.popupRows.addEventListener('click',e=>{const edit=e.target.closest('[data-edit]'),toggle=e.target.closest('[data-toggle]'),deleteRow=e.target.closest('[data-delete-row]');if(edit){editPopup(edit.dataset.edit);return}if(toggle){const p=popups.find(x=>x.id===toggle.dataset.toggle);if(p){p.visible=!p.visible;savePopups();renderRows()}return}if(deleteRow){const p=popups.find(x=>x.id===deleteRow.dataset.deleteRow);if(!p)return;if(!confirm('팝업을 삭제할까요?'))return;popups=popups.filter(x=>x.id!==deleteRow.dataset.deleteRow);if(popupId.value===deleteRow.dataset.deleteRow)resetEditor();savePopups();renderRows()}});resetEditor();renderRows();
</script></body></html>
