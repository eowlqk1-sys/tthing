        </div></nav></aside><main class="main"><header class="topbar"><button class="menu-toggle" id="menuToggle" type="button">☰</button><label class="search"><input id="topSearch" type="search" placeholder="게시글 제목, 작성자, 내용 검색"></label><a class="util-btn" href="/tthing/board.html" target="_blank" rel="noopener">고객 게시판 보기</a><div class="profile"><span class="avatar">E</span><span>eowlqk1 대표운영자</span></div></header><section class="content"><div class="page-head"><div><h1>게시판 관리</h1><p>공지사항, 상품문의, 리뷰 게시글을 등록하고 고객 페이지와 연동합니다.</p></div><button class="primary" id="newPost" type="button">새 글 등록</button></div><div class="metric-grid"><div class="metric"><span>전체 게시글</span><strong id="metricAll">0</strong></div><div class="metric"><span>공지사항</span><strong id="metricNotice">0</strong></div><div class="metric"><span>답변대기</span><strong id="metricPending">0</strong></div><div class="metric"><span>공개 게시글</span><strong id="metricVisible">0</strong></div></div><div class="grid"><section class="card"><div class="card-head"><div class="card-title">게시글 목록</div><span class="hint" id="countText"></span></div><div class="card-body"><div class="filters"><input id="keywordInput" type="search" placeholder="검색어"><select id="typeFilter"><option value="all">전체 게시판</option><option value="notice">공지사항</option><option value="qna">상품문의</option><option value="review">구매후기</option></select><select id="statusFilter"><option value="all">전체 상태</option><option value="pending">답변대기</option><option value="answered">답변완료</option></select><select id="visibilityFilter"><option value="all">공개/비공개 전체</option><option value="visible">공개</option><option value="hidden">비공개</option></select></div><div class="table-wrap"><table><thead><tr><th>No</th><th>게시판</th><th>제목</th><th>작성자</th><th>상태</th><th>공개</th><th>작성일</th><th>조회</th><th>관리</th></tr></thead><tbody id="postRows"></tbody></table></div><nav class="pagination" id="pagination"></nav></div></section><aside class="card"><div class="card-head"><div class="card-title" id="formTitle">새 글 등록</div><button class="ghost" id="resetForm" type="button">초기화</button></div><div class="card-body"><input id="postId" type="hidden"><div class="form-row"><div class="field"><label>게시판</label><select id="postType"><option value="notice">공지사항</option><option value="qna">상품문의</option><option value="review">구매후기</option></select></div><div class="field"><label>상태</label><select id="postStatus"><option value="pending">답변대기</option><option value="answered">답변완료</option></select></div></div><div class="field"><label>제목</label><input id="postTitle" placeholder="게시글 제목"></div><div class="form-row"><div class="field"><label>작성자</label><input id="postAuthor" placeholder="관리자 또는 고객명"></div><div class="field"><label>공개여부</label><select id="postVisible"><option value="visible">공개</option><option value="hidden">비공개</option></select></div></div><div class="field"><label>내용</label><textarea id="postBody" placeholder="게시글 내용을 입력하세요"></textarea></div><div class="field"><label>관리자 답변</label><textarea id="postAnswer" placeholder="문의 답변을 입력하세요"></textarea></div><div class="form-row"><button class="primary" id="savePost" type="button">저장</button><button class="danger" id="deletePost" type="button">삭제</button></div><p class="hint">저장한 내용은 고객 게시판에도 바로 표시됩니다.</p></div></aside></div></section></main></div><script>
const STORAGE_KEY='tthingBoardPosts';
const seedPosts=[{id:'notice-1',type:'notice',title:'배송 마감 시간 안내',author:'띵베이프',body:'평일 오후 3시 이전 결제 완료 주문은 당일 출고됩니다.',answer:'',status:'answered',visible:true,date:'2026-05-28',views:128},{id:'notice-2',type:'notice',title:'무니코틴 액상 입고 일정 안내',author:'띵베이프',body:'인기 무니코틴 액상 일부 품목이 순차 입고됩니다.',answer:'',status:'answered',visible:true,date:'2026-05-26',views:96},{id:'qna-1',type:'qna',title:'적립금은 언제 사용할 수 있나요?',author:'김도윤',body:'구매할 때 적립금 사용 조건이 궁금합니다.',answer:'상품 구매금액 20,000원 이상부터 사용 가능합니다.',status:'answered',visible:true,date:'2026-05-27',views:35},{id:'qna-2',type:'qna',title:'코일 호환 문의드립니다',author:'서유나',body:'기존 기기와 호환되는 코일 확인 부탁드립니다.',answer:'',status:'pending',visible:true,date:'2026-05-25',views:18},{id:'review-1',type:'review',title:'배송 빠르고 포장 깔끔합니다',author:'최하나',body:'액상 누수 없이 잘 받았습니다. 재구매 예정입니다.',answer:'소중한 후기 감사합니다.',status:'answered',visible:true,date:'2026-05-24',views:42}];
const typeLabel={notice:'공지사항',qna:'상품문의',review:'구매후기'},statusLabel={pending:'답변대기',answered:'답변완료'};let posts=loadPosts(),currentPage=1;const pageSize=10;
function loadPosts(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');return saved.length?saved:seedPosts}catch(e){return seedPosts}}function savePosts(){localStorage.setItem(STORAGE_KEY,JSON.stringify(posts))}function esc(v){return String(v||'').replace(/[&<>"]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]})}function today(){return new Date().toISOString().slice(0,10)}
function filtered(){const k=(keywordInput.value||topSearch.value||'').trim().toLowerCase();return posts.filter(function(p){const mk=!k||[p.title,p.author,p.body,p.answer].some(function(v){return String(v||'').toLowerCase().includes(k)});const mt=typeFilter.value==='all'||p.type===typeFilter.value;const ms=statusFilter.value==='all'||p.status===statusFilter.value;const mv=visibilityFilter.value==='all'||(visibilityFilter.value==='visible'?p.visible:!p.visible);return mk&&mt&&ms&&mv}).sort(function(a,b){return String(b.date).localeCompare(String(a.date))||String(b.id).localeCompare(String(a.id))})}
function renderMetrics(){metricAll.textContent=posts.length;metricNotice.textContent=posts.filter(p=>p.type==='notice').length;metricPending.textContent=posts.filter(p=>p.status==='pending').length;metricVisible.textContent=posts.filter(p=>p.visible).length}
function renderPagination(totalPages){if(totalPages<=1){pagination.innerHTML='';return}const start=Math.floor((currentPage-1)/10)*10+1,end=Math.min(totalPages,start+9);let html='<button type="button" data-page="'+Math.max(1,currentPage-1)+'" '+(currentPage===1?'disabled':'')+'>이전</button>';for(let p=start;p<=end;p++){html+='<button type="button" class="'+(p===currentPage?'active':'')+'" data-page="'+p+'">'+p+'</button>'}html+='<button type="button" data-page="'+Math.min(totalPages,currentPage+1)+'" '+(currentPage===totalPages?'disabled':'')+'>다음</button>';pagination.innerHTML=html}
function renderRows(){const list=filtered(),totalPages=Math.max(1,Math.ceil(list.length/pageSize));if(currentPage>totalPages)currentPage=totalPages;const items=list.slice((currentPage-1)*pageSize,currentPage*pageSize);postRows.innerHTML=items.map(function(p,i){return '<tr data-id="'+p.id+'"><td>'+(list.length-((currentPage-1)*pageSize+i))+'</td><td><span class="badge">'+typeLabel[p.type]+'</span></td><td class="title-cell"><strong>'+esc(p.title)+'</strong><span>'+esc(String(p.body).slice(0,46))+'</span></td><td>'+esc(p.author)+'</td><td><span class="badge '+(p.status==='answered'?'good':'warn')+'">'+statusLabel[p.status]+'</span></td><td><span class="badge '+(p.visible?'good':'danger')+'">'+(p.visible?'공개':'비공개')+'</span></td><td>'+p.date+'</td><td>'+(p.views||0)+'</td><td><div class="row-actions"><button type="button" data-edit="'+p.id+'">수정</button><button type="button" data-hide="'+p.id+'">'+(p.visible?'숨김':'공개')+'</button></div></td></tr>'}).join('')||'<tr><td colspan="9">게시글이 없습니다.</td></tr>';const s=list.length?((currentPage-1)*pageSize+1):0,e=Math.min(currentPage*pageSize,list.length);countText.textContent='총 '+list.length+'건 · '+s+'-'+e+'번째 · '+currentPage+'/'+totalPages+'페이지';renderPagination(totalPages);renderMetrics()}
function resetEditor(){postId.value='';postType.value='notice';postStatus.value='answered';postTitle.value='';postAuthor.value='띵베이프';postVisible.value='visible';postBody.value='';postAnswer.value='';formTitle.textContent='새 글 등록';deletePost.disabled=true}function editPost(id){const p=posts.find(x=>x.id===id);if(!p)return;postId.value=p.id;postType.value=p.type;postStatus.value=p.status;postTitle.value=p.title;postAuthor.value=p.author;postVisible.value=p.visible?'visible':'hidden';postBody.value=p.body||'';postAnswer.value=p.answer||'';formTitle.textContent='게시글 수정';deletePost.disabled=false;window.scrollTo({top:0,behavior:'smooth'})}function upsertPost(){const title=postTitle.value.trim();if(!title){alert('제목을 입력해주세요.');return}const id=postId.value||'post-'+Date.now(),cur=posts.find(x=>x.id===id);const next={id:id,type:postType.value,title:title,author:postAuthor.value.trim()||'띵베이프',body:postBody.value.trim(),answer:postAnswer.value.trim(),status:postStatus.value,visible:postVisible.value==='visible',date:cur?cur.date:today(),views:cur?cur.views:0};posts=cur?posts.map(x=>x.id===id?next:x):[next].concat(posts);savePosts();resetEditor();renderRows()}function removePost(){if(!postId.value)return;if(!confirm('게시글을 삭제할까요?'))return;posts=posts.filter(x=>x.id!==postId.value);savePosts();resetEditor();renderRows()}
menuToggle.addEventListener('click',()=>document.body.classList.toggle('nav-open'));overlay.addEventListener('click',()=>document.body.classList.remove('nav-open'));[keywordInput,typeFilter,statusFilter,visibilityFilter].forEach(el=>el.addEventListener('input',()=>{currentPage=1;renderRows()}));topSearch.addEventListener('input',()=>{keywordInput.value=topSearch.value;currentPage=1;renderRows()});pagination.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b||b.disabled)return;currentPage=Number(b.dataset.page)||1;renderRows()});postRows.addEventListener('click',e=>{const edit=e.target.closest('[data-edit]'),hide=e.target.closest('[data-hide]'),row=e.target.closest('tr[data-id]');if(edit){editPost(edit.dataset.edit);return}if(hide){const p=posts.find(x=>x.id===hide.dataset.hide);if(p){p.visible=!p.visible;savePosts();renderRows()}return}if(row)editPost(row.dataset.id)});newPost.addEventListener('click',resetEditor);resetForm.addEventListener('click',resetEditor);savePost.addEventListener('click',upsertPost);deletePost.addEventListener('click',removePost);window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY){posts=loadPosts();renderRows()}});resetEditor();renderRows();
</script></body></html>
