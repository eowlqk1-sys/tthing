  <script id="tthingAdminAuthGuard">
  (function(){
    const KEY='tthingAdminSession';
    function valid(){try{const session=JSON.parse(localStorage.getItem(KEY)||'{}');return session.authenticated===true&&session.user==='eowlqk1'&&Number(session.expiresAt||0)>Date.now()}catch(e){return false}}

function getImportedCustomers(){let saved=[];try{saved=JSON.parse(localStorage.getItem("tthingImportedCustomers")||"[]")}catch(error){}const byId=new Map([...(window.TTHING_IMPORTED_CUSTOMERS||[]),...saved].map(item=>[item.id,item]));return [...byId.values()]}

const statusLabel={active:'정상',dormant:'휴면예정',blocked:'차단'};const statusClass={active:'good',dormant:'warn',blocked:'warn'};const comma=v=>Number(v||0).toLocaleString('ko-KR');const params=new URLSearchParams(location.search);const id=params.get('id')||customers[0].id;const allCustomers=[...customers,...getImportedCustomers()].filter(item=>!deletedCustomerIds.has(item.id));if(deletedCustomerIds.has(id)){alert("삭제된 회원입니다.");location.replace("customer.html")}const base=allCustomers.find(c=>c.id===id)||allCustomers[0]||customers[0];const storeKey='tthingCustomerDetail:'+base.id;const saved=JSON.parse(localStorage.getItem(storeKey)||'{}');let customer={...base,...saved,grade:autoGrade({...base,...saved}),points:saved.points??base.points,pointLog:saved.pointLog||[{date:'2026-05-28',type:'추가',amount:base.points,reason:'기존 적립금 이관'}],password:saved.password||base.password||''};const orders=Array.from({length:Math.max(3,Math.min(8,Math.ceil(base.orders/3)))},(_,i)=>({date:['2026-05-28','2026-05-21','2026-05-12','2026-04-29','2026-04-10','2026-03-22','2026-03-02','2026-02-18'][i],no:'TTH'+String(2026052800-i*37),name:["칠렉스 입호흡 액상 30ml","고스트 스톰슬러시 30ml","프라임 아이스 피치 30ml","코일 팟 소모품 세트","일회용 전자담배 블루베리","타임세일 액상 3종 세트"][i%6],status:i===0?'배송준비중':i===1?'배송중':'배송완료',pay:Math.max(19000,Math.round(base.total/Math.max(1,base.orders)*(i+1)*0.9)),point:i%2?1000:0}));
function save(){localStorage.setItem(storeKey,JSON.stringify({bank:customer.bank,account:customer.account,holder:customer.holder,points:customer.points,pointLog:customer.pointLog,password:customer.password,memo:customer.memo}));}
function render(){document.title=customer.name+' 고객 상세 - 띵베이프 관리자';document.getElementById('pageTitle').textContent=customer.name+' 고객 상세';const badge=document.getElementById('statusBadge');badge.textContent=statusLabel[customer.status];badge.className='badge '+(statusClass[customer.status]||'');document.getElementById('basicInfo').innerHTML=[['아이디',customer.id],['이름',customer.name],['회원등급',customer.grade],['휴대폰',customer.phone],['이메일',customer.email],['주소',customer.address],['가입일',customer.joined],['최근 주문',customer.lastOrder]].map(row=>'<div class="info"><span>'+row[0]+'</span><strong>'+row[1]+'</strong></div>').join('');bankInput.value=customer.bank||'';holderInput.value=customer.holder||'';accountInput.value=customer.account||'';memoInput.value=customer.memo||'';pointTotal.textContent=comma(customer.points)+'원';passwordText.textContent=customer.password||'미설정';pointHistory.innerHTML=customer.pointLog.slice().reverse().map(log=>'<div class="history-row"><strong>'+log.type+' '+comma(log.amount)+'원</strong><span>'+log.date+' · '+log.reason+'</span></div>').join('');orderCount.textContent=orders.length+'건';orderRows.innerHTML=orders.map(o=>'<tr><td>'+o.date+'</td><td>'+o.no+'</td><td>'+o.name+'</td><td><span class="badge '+(o.status==='배송완료'?'good':'')+'">'+o.status+'</span></td><td class="price">'+comma(o.pay)+'원</td><td class="price">'+comma(o.point)+'원</td></tr>').join('');}
