  <script>
    const STORAGE_KEY = 'tthingAdminProducts';
    const DELETED_KEY = 'tthingDeletedProductCodes';
    const fileInput = document.getElementById('fileInput');
    const pasteInput = document.getElementById('pasteInput');
    const parseBtn = document.getElementById('parseBtn');
    const importBtn = document.getElementById('importBtn');
    const sampleBtn = document.getElementById('sampleBtn');
    const statusBox = document.getElementById('statusBox');
    const previewBody = document.getElementById('previewBody');
    const parsedCount = document.getElementById('parsedCount');
    const mappingInfo = document.getElementById('mappingInfo');
    let parsedProductsCache = [];

    const aliasMap = {
      code: ['상품코드', '자체상품코드', '제품코드'],
      name: ['상품명', '제품명'],
      category: ['상품분류', '카테고리', '분류'],
      display: ['진열상태', '진열'],
      selling: ['판매상태', '판매'],
      salePrice: ['판매가', '상품판매가'],
      retailPrice: ['소비자가', '소비자가격'],
      supplyPrice: ['공급가', '공급가격'],
      summary: ['상품요약설명', '요약설명', '상품간략설명'],
      simple: ['간략설명', '상품간략설명'],
      detail: ['상세설명', '상품상세설명', '상세내용'],
      images: ['대표이미지', '상품이미지', '이미지', '추가이미지'],
      detailImages: ['상품설명이미지', '상세이미지', '상세설명이미지', '상세설명 이미지'],
      optionInput: ['옵션입력', '옵션 입력', '옵션정보', '옵션 정보'],
      optionName: ['옵션명'],
      optionValue: ['옵션값'],
      optionPrice: ['추가금액', '옵션추가금액']
    };

    const normalizeHeader = (value) => String(value || '').replace(/[\s\-_/().\[\]{}]/g, '').toLowerCase();
    const formatWon = (value) => Number(value || 0).toLocaleString('ko-KR') + '원';
    const cleanText = (value) => String(value || '').trim();
    const toNumber = (value) => Number(String(value || '').replace(/[^0-9.-]/g, '')) || 0;
    const boolToTF = (value, fallback = 'T') => {
      const text = String(value || '').trim().toLowerCase();
      if (!text) return fallback;
      if (['f', 'false', '0', 'no', 'n', 'off', '판매안함', '진열안함', '미진열', '비노출'].includes(text)) return 'F';
      return 'T';
    };
    const escapeHtml = (value) => String(value || '').replace(/[&<>"]/g, function (char) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[char]; });


    function detectDelimiter(text) {
      const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n').filter((line) => line.trim());
      const first = lines[0] || '';
      const counts = [ ['\t', (first.split('\t').length - 1)], [',', (first.split(',').length - 1)], [';', (first.split(';').length - 1)], ['|', (first.split('|').length - 1)] ];
      counts.sort((a, b) => b[1] - a[1]);
      return counts[0][1] ? counts[0][0] : ',';
    }

    function parseDelimited(text, delimiter) {
      const rows = [];
      const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
      for (const line of lines) {
        if (!line.trim()) continue;
        const row = [];
        let cell = '';
        let quoted = false;
        for (let i = 0; i < line.length; i += 1) {
          const ch = line[i];
          const next = line[i + 1];
          if (quoted) {
            if (ch === '"' && next === '"') {
              cell += '"';
              i += 1;
            } else if (ch === '"') {
              quoted = false;
            } else {
              cell += ch;
            }
          } else if (ch === '"') {
            quoted = true;
          } else if (ch === delimiter) {
            row.push(cell);
            cell = '';
          } else {
            cell += ch;
          }
        }
        row.push(cell);
        rows.push(row);
      }
      return rows;
    }

    function splitList(value) {
      return String(value || '').split(/\r?\n|,|;|\|/).map((item) => item.trim()).filter(Boolean);
    }

    function findColumnIndex(headers, aliases) {
      const normalizedHeaders = headers.map(normalizeHeader);
      for (const alias of aliases) {
        const needle = normalizeHeader(alias);
        const index = normalizedHeaders.findIndex((header) => header === needle || header.includes(needle) || needle.includes(header));
        if (index !== -1) return index;
      }
      return -1;
    }

    function readByHeader(row, headers, aliases) {
      const index = findColumnIndex(headers, aliases);
      return index >= 0 ? cleanText(row[headers[index]]) : '';
    }

    function parseCafe24OptionText(value) {
      const text = cleanText(value);
      const match = text.match(/^([^{}]*)\{([\s\S]*)\}$/);
      if (!match) return { baseName: '', values: splitList(text) };
      const label = cleanText(match[1]);
      const baseName = label && !['옵션', 'option'].includes(label.toLowerCase()) ? label : '';
      return { baseName, values: splitList(match[2]) };
    }

    function parseOptionItems(row, headers) {
      const name = readByHeader(row, headers, aliasMap.optionName);
      const value = readByHeader(row, headers, aliasMap.optionValue);
      const optionInput = readByHeader(row, headers, aliasMap.optionInput);
      const price = toNumber(readByHeader(row, headers, aliasMap.optionPrice));
      const parsed = parseCafe24OptionText(value || optionInput || name);
      const values = parsed.values;
      if (!values.length) return [];
      const baseName = parsed.baseName || (value ? name : '');
      return values.map((item) => ({ name: baseName ? baseName + ': ' + item : item, addPrice: price, stock: 999, status: '판매함' }));
    }

    function readImages(row, headers) {
      return splitList(readByHeader(row, headers, aliasMap.images));
    }

    function readDetailImages(row, headers) {
      return splitList(readByHeader(row, headers, aliasMap.detailImages));
    }

    function buildProduct(row, headers, saved) {
      const name = readByHeader(row, headers, aliasMap.name) || '엑셀 등록 상품';
      const code = readByHeader(row, headers, aliasMap.code) || ('EXCEL-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7));
      const category = readByHeader(row, headers, aliasMap.category);
      const saleUnit = toNumber(readByHeader(row, headers, aliasMap.salePrice));
      const retailUnit = toNumber(readByHeader(row, headers, aliasMap.retailPrice) || saleUnit);
      const supplyUnit = toNumber(readByHeader(row, headers, aliasMap.supplyPrice) || saleUnit);
      const display = boolToTF(readByHeader(row, headers, aliasMap.display), 'T');
      const selling = boolToTF(readByHeader(row, headers, aliasMap.selling), 'T');
      const summary = readByHeader(row, headers, aliasMap.summary);
      const simple = readByHeader(row, headers, aliasMap.simple);
      const detailHtml = readByHeader(row, headers, aliasMap.detail);
      const images = readImages(row, headers);
      const detailImages = readDetailImages(row, headers);
      const optionItems = parseOptionItems(row, headers);
      const existing = saved[code] || {};
      return {
        ...existing,
        code,
        name,
        summary,
        simple,
        desc: simple || summary || category || '',
        detailHtml: detailHtml || existing.detailHtml || (detailImages.length ? detailImages.map(function (src) { return '<p><img class="detail-image" src="' + escapeHtml(src) + '" alt="' + escapeHtml(name) + ' 상세 이미지"></p>'; }).join('') : ''),
        seo: {
          open: true,
          title: name,
          author: existing.seo && existing.seo.author ? existing.seo.author : '',
          description: summary || simple || name,
          keywords: [name, category].filter(Boolean).join(', '),
          ...(existing.seo || {})
        },
        category,
        categories: category ? [category] : [],
        additionalProducts: existing.additionalProducts || [],
        relatedProducts: existing.relatedProducts || [],
        optionUse: optionItems.length > 0,
        exposure: existing.exposure || 'all',
        display,
        selling,
        mainDisplay: existing.mainDisplay || [],
        price: formatWon(saleUnit),
        unit: saleUnit,
        retailPrice: formatWon(retailUnit),
        retailUnit,
        supplyPrice: formatWon(supplyUnit),
        supplyUnit,
        origin: existing.origin || '',
        optionItems: optionItems.length ? optionItems : (existing.optionItems || []),
        options: optionItems.length ? optionItems.map((item) => item.name) : (existing.options || ['기본상품']),
        productImages: images.length ? images : (existing.productImages || existing.images || []),
        detailImages: detailImages.length ? detailImages : (existing.detailImages || []),
        images: images.length ? images : (existing.productImages || existing.images || []),
        updatedAt: new Date().toISOString()
      };
    }

    function renderStatus(text, kind) {
      statusBox.textContent = text;
      statusBox.className = 'status' + (kind ? ' ' + kind : '');
    }

    function renderPreview(products) {
      parsedCount.textContent = products.length + '건';
      if (!products.length) {
        previewBody.innerHTML = '<tr><td colspan="6" class="small">미리보기 데이터가 없습니다.</td></tr>';
        mappingInfo.textContent = '대기 중';
        return;
      }
      mappingInfo.textContent = '첫 ' + Math.min(products.length, 12) + '건 표시';
      previewBody.innerHTML = products.slice(0, 12).map((item) => {
        const optionText = item.optionItems && item.optionItems.length ? item.optionItems.map((option) => option.name).join(', ') : ((item.options || []).join(', '));
        const imageText = item.images && item.images.length ? item.images[0] : '-';
        return '<tr><td>' + escapeHtml(item.code) + '</td><td>' + escapeHtml(item.name) + '</td><td class="small">' + escapeHtml(item.category || '-') + '</td><td>' + escapeHtml(item.price || '-') + '</td><td class="small">' + escapeHtml(optionText || '-') + '</td><td class="small">' + escapeHtml(imageText) + '</td></tr>';
      }).join('');
    }

    async function parseXlsx(buffer) {
      const bytes = new Uint8Array(buffer);
      const view = new DataView(buffer);
      let eocd = -1;
      for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i -= 1) {
        if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
      }
      if (eocd < 0) throw new Error('ZIP footer를 찾지 못했습니다.');
      const totalEntries = view.getUint16(eocd + 10, true);
      const centralOffset = view.getUint32(eocd + 16, true);
      const decoder = new TextDecoder('utf-8');
      const files = new Map();
      let ptr = centralOffset;
      for (let i = 0; i < totalEntries; i += 1) {
        if (view.getUint32(ptr, true) !== 0x02014b50) throw new Error('ZIP 중앙 디렉터리 형식이 아닙니다.');
        const compression = view.getUint16(ptr + 10, true);
        const compressedSize = view.getUint32(ptr + 20, true);
        const nameLen = view.getUint16(ptr + 28, true);
        const extraLen = view.getUint16(ptr + 30, true);
        const commentLen = view.getUint16(ptr + 32, true);
        const localOffset = view.getUint32(ptr + 42, true);
        const name = decoder.decode(bytes.slice(ptr + 46, ptr + 46 + nameLen));
        const localNameLen = view.getUint16(localOffset + 26, true);
        const localExtraLen = view.getUint16(localOffset + 28, true);
        const dataStart = localOffset + 30 + localNameLen + localExtraLen;
        const data = bytes.slice(dataStart, dataStart + compressedSize);
        files.set(name, { compression, data });
        ptr += 46 + nameLen + extraLen + commentLen;
      }
      async function readEntry(name) {
        const entry = files.get(name);
        if (!entry) return '';
        if (entry.compression === 0) return decoder.decode(entry.data);
        if (entry.compression === 8) {
          if (!('DecompressionStream' in window)) throw new Error('이 브라우저는 XLSX 압축 해제를 지원하지 않습니다.');
          const stream = new Blob([entry.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
          const ab = await new Response(stream).arrayBuffer();
          return decoder.decode(ab);
        }
        throw new Error('지원하지 않는 압축 방식입니다.');
      }
      const workbookXml = await readEntry('xl/workbook.xml');
      const relsXml = await readEntry('xl/_rels/workbook.xml.rels');
      const workbookDoc = new DOMParser().parseFromString(workbookXml, 'application/xml');
      const relsDoc = new DOMParser().parseFromString(relsXml, 'application/xml');
      const sheet = workbookDoc.getElementsByTagName('sheet')[0];
      if (!sheet) throw new Error('워크북 시트를 찾지 못했습니다.');
      const relId = sheet.getAttribute('r:id') || sheet.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
      const rel = Array.from(relsDoc.getElementsByTagName('Relationship')).find((node) => node.getAttribute('Id') === relId);
      const target = rel ? rel.getAttribute('Target') : 'worksheets/sheet1.xml';
      const sheetPath = target.indexOf('xl/') === 0 ? target : 'xl/' + target;
      const sharedStringsXml = files.has('xl/sharedStrings.xml') ? await readEntry('xl/sharedStrings.xml') : '';
      const sharedStrings = sharedStringsXml ? Array.from(new DOMParser().parseFromString(sharedStringsXml, 'application/xml').getElementsByTagName('si')).map((node) => node.textContent || '') : [];
      const sheetXml = await readEntry(sheetPath);
      const sheetDoc = new DOMParser().parseFromString(sheetXml, 'application/xml');
      return Array.from(sheetDoc.getElementsByTagName('row')).map((row) => {
        const cells = [];
        Array.from(row.getElementsByTagName('c')).forEach((cell) => {
          const ref = cell.getAttribute('r') || '';
          const type = cell.getAttribute('t') || '';
          const match = ref.match(/^[A-Z]+/);
          const column = match ? match[0] : '';
          const index = column.split('').reduce(function (sum, char) { return sum * 26 + char.charCodeAt(0) - 64; }, 0) - 1;
          let value = '';
          if (type === 's') value = sharedStrings[Number((cell.getElementsByTagName('v')[0] && cell.getElementsByTagName('v')[0].textContent) || 0)] || '';
          else if (type === 'inlineStr') value = cell.textContent || '';
          else value = (cell.getElementsByTagName('v')[0] && cell.getElementsByTagName('v')[0].textContent) || '';
          cells[index] = value;
        });
        return cells;
      });
    }

    async function loadRowsFromFile(file) {
      const ext = file.name.split('.').pop().toLowerCase();
      if (ext === 'xlsx' || ext === 'xls') return parseXlsx(await file.arrayBuffer());
      const text = await file.text();
      return parseDelimited(text, detectDelimiter(text));
    }

    async function parseInput() {
      try {
        let rows = [];
        if (fileInput.files && fileInput.files[0]) {
          rows = await loadRowsFromFile(fileInput.files[0]);
        } else if (pasteInput.value.trim()) {
          const text = pasteInput.value;
          rows = parseDelimited(text, detectDelimiter(text));
        }
        if (!rows.length) {
          renderStatus('읽을 데이터가 없습니다.', 'err');
          parsedProductsCache = [];
          renderPreview([]);
          return [];
        }
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        const headers = rows[0].map((value) => cleanText(value));
        const products = rows.slice(1).map((row) => {
          const record = {};
          headers.forEach((header, index) => { record[header] = cleanText(row[index] || ''); });
          return buildProduct(record, headers, saved);
        }).filter((item) => item.code || item.name);
        parsedProductsCache = products;
        renderPreview(products);
        renderStatus('헤더 ' + headers.length + '개, 상품 ' + products.length + '건을 읽었습니다.', 'ok');
        return products;
      } catch (error) {
        parsedProductsCache = [];
        renderStatus(error.message || '파일을 읽지 못했습니다.', 'err');
        renderPreview([]);
        return [];
      }
    }

    function persistAdminProductsToServer() {
      try {
        const products = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        const deletedCodes = JSON.parse(localStorage.getItem(DELETED_KEY) || '[]');
        fetch('/api/admin-products', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ products, deletedCodes }) }).catch(() => {});
      } catch (error) {}
    }

    function saveProducts(products) {
      if (!products.length) {
        renderStatus('저장할 상품이 없습니다. 파일을 선택하거나 표를 붙여넣은 뒤 다시 눌러주세요.', 'err');
        return false;
      }
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        const deleted = new Set(JSON.parse(localStorage.getItem(DELETED_KEY) || '[]'));
        let legacySaved = {};
        try { legacySaved = JSON.parse(localStorage.getItem("tthingCustomerProducts") || "{}"); } catch (error) { legacySaved = {}; }
        Object.values(legacySaved).forEach((item) => { if (item && item.code && !deleted.has(item.code) && !saved[item.code]) saved[item.code] = item; });
        products.forEach((product) => {
          const item = { ...(saved[product.code] || {}), ...product, updatedAt: new Date().toISOString() };
          saved[product.code] = item;
          deleted.delete(product.code);
        });
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(saved)); }
        catch (error) {
          Object.values(saved).forEach((item) => { item.productImages = []; item.images = []; item.detailImages = []; item.detailHtml = ""; });
          localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
        }
        localStorage.removeItem("tthingCustomerProducts");
        localStorage.setItem('tthingAdminProductsUpdatedAt', String(Date.now()));
        localStorage.setItem(DELETED_KEY, JSON.stringify(Array.from(deleted)));
        localStorage.setItem('tthingLastAdminProductCode', products[products.length - 1].code);
        persistAdminProductsToServer();
        renderStatus('상품 ' + products.length + '건을 저장했습니다. 상품목록에서 확인할 수 있습니다.', 'ok');
        return true;
      } catch (error) {
        const quotaMessage = error && (error.name === 'QuotaExceededError' || String(error.message || '').includes('quota')) ? '저장 공간이 부족합니다. 이미지가 base64로 큰 경우 이미지 URL 방식으로 등록해주세요.' : (error.message || '상품 저장 중 오류가 발생했습니다.');
        renderStatus(quotaMessage, 'err');
        return false;
      }
    }

    parseBtn.addEventListener('click', function () { parseInput(); });
    importBtn.addEventListener('click', async function () {
      importBtn.disabled = true;
      importBtn.textContent = '저장 중';
      try {
        const products = parsedProductsCache.length ? parsedProductsCache : await parseInput();
        const saved = saveProducts(products);
        if (saved) alert('상품 ' + products.length + '건을 저장했습니다.');
      } finally {
        importBtn.disabled = false;
        importBtn.textContent = '상품으로 저장';
      }
    });

    sampleBtn.addEventListener('click', function () {
      const headers = ['상품코드', '상품명', '상품분류', '진열상태', '판매상태', '판매가', '소비자가', '공급가', '옵션명', '옵션값', '상품요약설명', '간략설명', '상세설명', '대표이미지', '상품설명이미지'];
      const rows = [headers, ['P0000ABC', '샘플 상품', '액상 > 입호흡', '진열함', '판매함', '10000', '12000', '8000', '색상', '블랙, 화이트', '요약설명', '간략설명', '<p>상세설명</p>', 'https://example.com/image.jpg', 'https://example.com/detail.jpg']];
      const csv = rows.map(function (row) { return row.map(function (value) { return '"' + String(value || '').replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'cafe24-product-sample.csv';
      document.body.appendChild(link);
      link.click();
      URL.revokeObjectURL(link.href);
      link.remove();
    });
    fileInput.addEventListener('change', function () { parseInput(); });
    pasteInput.addEventListener('input', function () { parseInput(); });
    renderPreview([]);
  </script>
</body>
</html>
