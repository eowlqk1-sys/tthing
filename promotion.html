<meta name="viewport" content="width=device-width, initial-scale=1"><title>프로모션 관리 - 띵베이프 관리자</title><style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--bg:#f4f6f8;--sidebar:#172033;--sidebar-2:#111827;--blue:#2563eb;--green:#15803d;--red:#dc2626;--yellow:#d97706;--shadow:0 16px 36px rgba(15,23,42,.08)}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg)}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:232px 1fr}.sidebar{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,var(--sidebar),var(--sidebar-2));color:#dbe4ff;overflow-y:auto}.brand{height:72px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid rgba(255,255,255,.08)}.brand-mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#4ade80,#2f7df6);color:#fff;font-weight:900}.brand-text strong{display:block;color:#fff;font-size:17px}.brand-text span{display:block;margin-top:2px;color:#9fb1d7;font-size:11px;font-weight:800}.nav-section{padding:14px 12px 6px}.nav-title{padding:10px;color:#8ea0c7;font-size:11px;font-weight:900}.nav-link{width:100%;min-height:42px;margin:2px 0;padding:0 11px;border-radius:8px;display:flex;align-items:center;gap:10px;color:#cbd6f4;font-size:14px;font-weight:800}.nav-link:hover,.nav-link.active{background:rgba(255,255,255,.1);color:#fff}.nav-ico{width:22px;text-align:center;color:#93c5fd;font-size:15px}.main{min-width:0}.topbar{position:sticky;top:0;z-index:20;height:64px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);backdrop-filter:blur(12px);display:flex;align-items:center;gap:14px;padding:0 24px}.menu-toggle{display:none;width:38px;height:38px;border:1px solid var(--line);border-radius:8px;background:#fff}.util-btn{min-height:36px;display:inline-flex;align-items:center;justify-content:center;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#374151;font-size:13px;font-weight:800}.profile{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:13px;font-weight:900}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff}.content{padding:24px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px}h1{margin:0;font-size:26px}.page-head p{margin:7px 0 0;color:var(--muted);font-size:14px}.primary,.ghost,.danger{min-height:38px;border-radius:8px;padding:0 13px;font-weight:900}.primary{border:0;background:var(--blue);color:#fff}.ghost{border:1px solid var(--line);background:#fff;color:#374151}.danger{border:0;background:var(--red);color:#fff}.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.metric{border:1px solid var(--line);border-radius:9px;background:#fff;padding:14px}.metric span{display:block;color:var(--muted);font-size:12px;font-weight:900}.metric strong{display:block;margin-top:7px;font-size:25px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px}.card{border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:var(--shadow);overflow:hidden}.card-head{min-height:56px;padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.card-title{font-weight:900;font-size:17px}.card-body{padding:18px}.filters{display:grid;grid-template-columns:1.5fr 150px 150px;gap:8px;margin-bottom:12px}.filters input,.filters select,.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;outline:0}.filters input,.filters select,.field input,.field select{height:40px;padding:0 11px}.field{display:grid;gap:7px;margin-bottom:10px}.field label{color:#4b5563;font-size:12px;font-weight:900}.field textarea{min-height:86px;padding:10px;resize:vertical;line-height:1.5}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}table{width:100%;min-width:920px;border-collapse:collapse;font-size:13px;background:#fff}th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}th{background:#fafafa;color:var(--muted);font-size:12px;font-weight:900}tbody tr:hover{background:#f8fbff}.title-cell strong{display:block}.title-cell span{display:block;margin-top:4px;color:var(--muted);font-size:12px;white-space:normal}.price{font-variant-numeric:tabular-nums;text-align:right}.badge{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:999px;background:#eef2ff;color:#3b5ccc;font-size:11px;font-weight:900}.badge.good{background:#ecfdf3;color:#15803d}.badge.warn{background:#fff7e4;color:#d97706}.badge.danger{background:#fef2f2;color:#dc2626}.row-actions{display:flex;gap:6px}.row-actions button{min-height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 9px;font-size:12px;font-weight:900}.hint{color:var(--muted);font-size:12px;line-height:1.55}.mobile-overlay{display:none;position:fixed;inset:0;z-index:30;background:rgba(15,23,42,.46)}@media(max-width:1100px){.grid{grid-template-columns:1fr}.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:1fr 1fr}}@media(max-width:840px){html,body{overflow-x:hidden}.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:40;left:0;top:0;width:232px;transform:translateX(-100%);transition:transform .18s ease}body.nav-open .sidebar{transform:translateX(0)}body.nav-open .mobile-overlay{display:block}.menu-toggle{display:inline-grid;place-items:center}.topbar{height:auto;min-height:58px;padding:8px 12px}.profile span:not(.avatar){display:none}.content{padding:14px 12px 22px}.page-head{align-items:stretch;flex-direction:column}.metric-grid,.filters,.form-row{grid-template-columns:1fr}.card-head{align-items:flex-start;flex-direction:column;padding:14px}.card-body{padding:14px}table{min-width:820px}}
</style>  <script id="tthingAdminAuthGuard">
  (function(){
    const KEY='tthingAdminSession';
    function valid(){try{const session=JSON.parse(localStorage.getItem(KEY)||'{}');return session.authenticated===true&&session.user==='eowlqk1'&&Number(session.expiresAt||0)>Date.now()}catch(e){return false}}
    if(!valid()){
      const next=encodeURIComponent(location.pathname.split('/').pop()+location.search+location.hash);
      location.replace('login.html?next='+next);
      return;
    }
    window.tthingAdminLogout=function(){localStorage.removeItem(KEY);location.href='login.html'};
    document.addEventListener('DOMContentLoaded',function(){
      document.querySelectorAll('.profile').forEach(function(profile){
        if(profile.querySelector('[data-admin-logout]'))return;
        const button=document.createElement('button');
        button.type='button';
        button.textContent='로그아웃';
        button.setAttribute('data-admin-logout','');
        button.style.cssText='min-height:30px;border:1px solid #e5e7eb;border-radius:7px;background:#fff;color:#374151;padding:0 9px;font-size:12px;font-weight:900;cursor:pointer';
        button.addEventListener('click',window.tthingAdminLogout);
        profile.appendChild(button);
      });
    });
  })();
  </script>
</head><body><div class="mobile-overlay" id="overlay"></div><div class="app"><aside class="sidebar"><a class="brand" href="index.html"><span class="brand-mark">띵</span><span class="brand-text"><strong>띵베이프</strong><span>ADMIN CENTER</span></span></a><nav><div class="nav-section"><div class="nav-title">쇼핑몰</div><a class="nav-link" href="index.html"><span class="nav-ico">⌂</span>홈</a><a class="nav-link" href="orders.html"><span class="nav-ico">≡</span>주문</a><a class="nav-link" href="product.html"><span class="nav-ico">□</span>상품</a><a class="nav-link" href="customer.html"><span class="nav-ico">◎</span>고객</a><a class="nav-link" href="#"><span class="nav-ico">✉</span>메시지</a><a class="nav-link" href="board.html"><span class="nav-ico">◫</span>게시판</a><a class="nav-link" href="popup.html"><span class="nav-ico">▣</span>팝업</a></div><div class="nav-section"><div class="nav-title">운영</div><a class="nav-link active" href="promotion.html"><span class="nav-ico">%</span>프로모션</a><a class="nav-link" href="#"><span class="nav-ico">▣</span>통합엑셀</a></div><div class="nav-section"><div class="nav-title">채널/설정</div><a class="nav-link" href="#"><span class="nav-ico">＋</span>마켓플러스</a><a class="nav-link" href="settings.html"><span class="nav-ico">⚙</span>쇼핑몰 설정</a></div></nav></aside><main class="main"><header class="topbar"><button class="menu-toggle" id="menuToggle" type="button">☰</button><a class="util-btn" href="/tthing/index.html" target="_blank" rel="noopener">PC 쇼핑몰</a><div class="profile"><span class="avatar">E</span><span>eowlqk1 대표운영자</span></div></header><section class="content"><div class="page-head"><div><h1>프로모션 관리</h1><p>진행할 이벤트를 등록하고 금액할인과 기간을 관리합니다.</p></div><button class="primary" id="newPromotion" type="button">새 프로모션</button></div><div class="metric-grid"><div class="metric"><span>전체 이벤트</span><strong id="metricAll">0</strong></div><div class="metric"><span>진행중</span><strong id="metricActive">0</strong></div><div class="metric"><span>예정</span><strong id="metricUpcoming">0</strong></div><div class="metric"><span>종료</span><strong id="metricExpired">0</strong></div></div><div class="grid"><section class="card"><div class="card-head"><div class="card-title">프로모션 목록</div><span class="hint" id="countText"></span></div><div class="card-body"><div class="filters"><input id="keywordInput" type="search" placeholder="이벤트명, 설명 검색"><select id="statusFilter"><option value="all">전체 상태</option><option value="active">진행중</option><option value="upcoming">예정</option><option value="expired">종료</option><option value="hidden">비공개</option></select><select id="sortFilter"><option value="latest">최근 등록순</option><option value="start">시작일순</option><option value="discount">할인금액순</option></select></div><div class="table-wrap"><table><thead><tr><th>이벤트</th><th>상태</th><th>할인금액</th><th>기간</th><th>공개</th><th>관리</th></tr></thead><tbody id="promotionRows"></tbody></table></div></div></section><aside class="card"><div class="card-head"><div class="card-title" id="formTitle">새 프로모션</div><button class="ghost" id="resetForm" type="button">초기화</button></div><div class="card-body"><input id="promotionId" type="hidden"><div class="field"><label>이벤트명</label><input id="promotionTitle" placeholder="예: 주말 3천원 할인"></div><div class="field"><label>이벤트 설명</label><textarea id="promotionDesc" placeholder="관리자가 확인할 이벤트 내용을 입력하세요"></textarea></div><div class="field"><label>금액할인</label><input id="discountAmount" type="number" min="0" step="100" placeholder="예: 3000"></div><div class="form-row"><div class="field"><label>시작일</label><input id="startDate" type="date"></div><div class="field"><label>종료일</label><input id="endDate" type="date"></div></div><div class="form-row"><div class="field"><label>공개여부</label><select id="promotionVisible"><option value="visible">공개</option><option value="hidden">비공개</option></select></div><div class="field"><label>최소주문금액</label><input id="minimumOrder" type="number" min="0" step="1000" placeholder="선택 입력"></div></div><div class="form-row"><button class="primary" id="savePromotion" type="button">저장</button><button class="danger" id="deletePromotion" type="button">삭제</button></div><p class="hint">기간은 시작일 00:00부터 종료일 23:59까지로 계산합니다.</p></div></aside></div></section></main></div><script>
const STORAGE_KEY='tthingPromotions';
let promotions=loadPromotions();
const els={menuToggle:document.getElementById('menuToggle'),overlay:document.getElementById('overlay'),rows:document.getElementById('promotionRows'),keyword:document.getElementById('keywordInput'),status:document.getElementById('statusFilter'),sort:document.getElementById('sortFilter'),newBtn:document.getElementById('newPromotion'),resetBtn:document.getElementById('resetForm'),saveBtn:document.getElementById('savePromotion'),deleteBtn:document.getElementById('deletePromotion')};
function loadPromotions(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch(e){return []}}
function savePromotions(){localStorage.setItem(STORAGE_KEY,JSON.stringify(promotions));localStorage.setItem(STORAGE_KEY+'UpdatedAt',String(Date.now()))}
function esc(v){return String(v||'').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]))}
function won(v){return (Number(v)||0).toLocaleString('ko-KR')+'원'}
function today(){return new Date().toISOString().slice(0,10)}
function statusOf(p){if(!p.visible)return 'hidden';const now=today();if(p.startDate&&now<p.startDate)return 'upcoming';if(p.endDate&&now>p.endDate)return 'expired';return 'active'}
function statusLabel(status){return {active:'진행중',upcoming:'예정',expired:'종료',hidden:'비공개'}[status]||'진행중'}
function statusClass(status){return status==='active'?'good':status==='upcoming'?'warn':status==='expired'||status==='hidden'?'danger':''}
function filtered(){const keyword=els.keyword.value.trim().toLowerCase();return promotions.filter(p=>{const status=statusOf(p);const matchKeyword=!keyword||[p.title,p.desc].some(v=>String(v||'').toLowerCase().includes(keyword));const matchStatus=els.status.value==='all'||status===els.status.value;return matchKeyword&&matchStatus}).sort((a,b)=>{if(els.sort.value==='start')return String(a.startDate||'9999').localeCompare(String(b.startDate||'9999'));if(els.sort.value==='discount')return Number(b.discountAmount||0)-Number(a.discountAmount||0);return String(b.createdAt||'').localeCompare(String(a.createdAt||''))})}
function renderMetrics(){const counts={all:promotions.length,active:0,upcoming:0,expired:0};promotions.forEach(p=>{const status=statusOf(p);if(status==='active')counts.active++;else if(status==='upcoming')counts.upcoming++;else if(status==='expired')counts.expired++});metricAll.textContent=counts.all;metricActive.textContent=counts.active;metricUpcoming.textContent=counts.upcoming;metricExpired.textContent=counts.expired}
function renderRows(){renderMetrics();const items=filtered();countText.textContent='총 '+items.length+'개';els.rows.innerHTML=items.map(p=>{const status=statusOf(p);return '<tr><td class="title-cell"><strong>'+esc(p.title||'이름 없는 이벤트')+'</strong><span>'+esc(p.desc||'설명 없음')+'</span></td><td><span class="badge '+statusClass(status)+'">'+statusLabel(status)+'</span></td><td class="price">'+won(p.discountAmount)+'</td><td>'+esc(p.startDate||'-')+' ~ '+esc(p.endDate||'-')+'</td><td>'+(p.visible?'공개':'비공개')+'</td><td><div class="row-actions"><button type="button" data-edit="'+p.id+'">수정</button><button type="button" data-toggle="'+p.id+'">'+(p.visible?'숨김':'공개')+'</button><button type="button" data-delete-row="'+p.id+'">삭제</button></div></td></tr>'}).join('')||'<tr><td colspan="6">등록된 프로모션이 없습니다.</td></tr>'}
function resetEditor(){promotionId.value='';promotionTitle.value='';promotionDesc.value='';discountAmount.value='';startDate.value=today();endDate.value=today();promotionVisible.value='visible';minimumOrder.value='';formTitle.textContent='새 프로모션';els.deleteBtn.disabled=true}
function editPromotion(id){const p=promotions.find(item=>item.id===id);if(!p)return;promotionId.value=p.id;promotionTitle.value=p.title||'';promotionDesc.value=p.desc||'';discountAmount.value=p.discountAmount||'';startDate.value=p.startDate||today();endDate.value=p.endDate||today();promotionVisible.value=p.visible?'visible':'hidden';minimumOrder.value=p.minimumOrder||'';formTitle.textContent='프로모션 수정';els.deleteBtn.disabled=false;window.scrollTo({top:0,behavior:'smooth'})}
function saveCurrent(){const title=promotionTitle.value.trim();const discount=Number(discountAmount.value)||0;if(!title){alert('이벤트명을 입력해주세요.');return}if(discount<=0){alert('금액할인을 1원 이상 입력해주세요.');return}if(startDate.value&&endDate.value&&startDate.value>endDate.value){alert('종료일은 시작일보다 빠를 수 없습니다.');return}const id=promotionId.value||'promotion-'+Date.now();const current=promotions.find(p=>p.id===id);const next={id,title,desc:promotionDesc.value.trim(),discountAmount:discount,startDate:startDate.value,endDate:endDate.value,visible:promotionVisible.value==='visible',minimumOrder:Number(minimumOrder.value)||0,createdAt:current?current.createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};promotions=current?promotions.map(p=>p.id===id?next:p):promotions.concat(next);savePromotions();resetEditor();renderRows();alert('저장되었습니다.')}
function deleteCurrent(){if(!promotionId.value)return;if(!confirm('프로모션을 삭제할까요?'))return;promotions=promotions.filter(p=>p.id!==promotionId.value);savePromotions();resetEditor();renderRows()}
els.menuToggle.addEventListener('click',()=>document.body.classList.toggle('nav-open'));els.overlay.addEventListener('click',()=>document.body.classList.remove('nav-open'));els.keyword.addEventListener('input',renderRows);els.status.addEventListener('change',renderRows);els.sort.addEventListener('change',renderRows);els.newBtn.addEventListener('click',resetEditor);els.resetBtn.addEventListener('click',resetEditor);els.saveBtn.addEventListener('click',saveCurrent);els.deleteBtn.addEventListener('click',deleteCurrent);els.rows.addEventListener('click',e=>{const edit=e.target.closest('[data-edit]'),toggle=e.target.closest('[data-toggle]'),del=e.target.closest('[data-delete-row]');if(edit){editPromotion(edit.dataset.edit);return}if(toggle){const p=promotions.find(item=>item.id===toggle.dataset.toggle);if(p){p.visible=!p.visible;savePromotions();renderRows()}return}if(del){if(!confirm('프로모션을 삭제할까요?'))return;promotions=promotions.filter(p=>p.id!==del.dataset.deleteRow);if(promotionId.value===del.dataset.deleteRow)resetEditor();savePromotions();renderRows()}});
resetEditor();renderRows();
</script></body></html>
